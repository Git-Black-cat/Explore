  *,*::before,*::after{ box-sizing:border-box; }
  html{ font-size:17px; }
  /* Op een gsm in portretstand (smal scherm) lees je van dichterbij en met minder precisie dan
     achter een pc-scherm, dus daar verdient de hele app een grotere basisletter én grotere
     icoontjes voor de leesbaarheid. Eerst op verzoek verdubbeld (2x = 44px), toen met 50%
     teruggebracht (22px), en op verzoek nog eens naar 80% daarvan (18px) — zie ook alle vaste
     icoonmaten verderop in dit bestand. Op de pc en op de gsm in landscape (breder dan 600px, of
     niet portret) blijft 17px ongemoeid: dat was al goed. */
  @media (max-width:600px) and (orientation:portrait){
    html{ font-size:18px; }
  }
  html,body{ margin:0; padding:0; }
  body{
    background-color:var(--bg);
    background-image:var(--bg-pattern);
    background-repeat:repeat;
    background-size:220px 220px;
    color:var(--text);
    font-family:var(--font-body);
    font-size:1rem;
    line-height:1.5;
    -webkit-tap-highlight-color:transparent;
  }
  body.no-pattern{ background-image:none; }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; }
  a{ color:var(--secondary); }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  /* ============================== SHELL: ZIJBALK (DESKTOP) + TABBALK (MOBIEL) ==============================
     Vroeger had de app geen enkele breedte-begrenzing op desktop: rijen en kaarten rekten zich
     uit over het hele brede scherm met vooral lucht erin, en navigeren tussen onderdelen kon
     alleen via het dashboard. Vanaf hier krijgt de app op grotere schermen een vaste linker
     zijbalk (ieder onderdeel altijd één klik weg) en op de telefoon een onderste tabbalk met de
     belangrijkste onderdelen binnen duimbereik — zonder eerst terug naar het dashboard te moeten. */
  .shell{ display:block; }
  .shell-main{ min-width:0; }
  .sidebar{ display:none; }
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:flex; align-items:stretch; justify-content:space-around;
    background:color-mix(in srgb, var(--surface) 96%, transparent);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    padding:4px 2px env(safe-area-inset-bottom,4px);
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
  }
  .tabbar-link{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    padding:6px 2px; background:none; border:none; color:var(--text-muted); font-family:inherit;
    font-size:.74rem; font-weight:600; cursor:pointer; min-width:0;
  }
  .tabbar-link .ic{ width:22px; height:22px; }
  .tabbar-link span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .tabbar-link.active{ color:var(--accent); }
  .tabbar-link.active .ic{ color:var(--accent); }
  @media (max-width:600px) and (orientation:portrait){
    .tabbar-link .ic{ width:20px; height:20px; }
  }
  @media (min-width:900px){
    .shell{ display:grid; grid-template-columns:254px minmax(0,1fr); min-height:100vh; }
    .tabbar{ display:none; }
    .sidebar{
      display:flex; flex-direction:column; gap:2px;
      position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
      padding:18px 14px 20px; border-right:1px solid var(--border);
      background:color-mix(in srgb, var(--surface) 92%, transparent);
    }
    .sidebar-brand{
      display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:600;
      font-size:1.1rem; padding:6px 10px 16px; border-bottom:1px solid var(--border); margin-bottom:10px;
    }
    .sidebar-brand .flag-ic{ font-size:1.3em; }
    .sidebar-link{
      display:flex; align-items:center; gap:11px; width:100%; text-align:left;
      padding:10px 12px; border-radius:var(--radius-sm); border:none; background:none;
      color:var(--text); font-family:inherit; font-size:.96rem; font-weight:600; cursor:pointer;
    }
    .sidebar-link .ic{ width:19px; height:19px; flex:none; color:var(--text-muted); }
    .sidebar-link:hover{ background:var(--surface-2); }
    .sidebar-link.active{ background:var(--accent-soft); color:var(--accent); }
    .sidebar-link.active .ic{ color:var(--accent); }
    .sidebar-divider{ height:1px; background:var(--border); margin:10px 10px; flex:none; }
  }

  .container{ padding:16px 18px 40px; max-width:720px; margin:0 auto; width:100%; }
  .container-wide{ max-width:1180px; }
  /* Ruimte vrijhouden onderaan zodat de laatste rij content (of de Opslaan-knop van een formulier)
     niet achter de vaste tabbalk op de telefoon verdwijnt. Deze regel moet NA de basisregel hierboven
     staan, anders wint de kortere "padding"-shorthand daarboven en wordt dit stilletjes overschreven. */
  @media (max-width:899px){
    .container{ padding-bottom:104px; }
  }
  @media (min-width:900px){
    .container{ padding:30px 36px 48px; }
  }

  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:10px;
    padding:14px 18px; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    box-shadow:0 7px 0 -5px var(--bg), 0 8px 0 -5px var(--border);
  }
  .topbar h1{ font-size:1.3rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar:not(:has(.icon-btn)) h1::before{ content:"🧭"; margin-right:7px; font-size:.85em; filter:saturate(1.15); }
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); cursor:pointer; flex:none;
    transition:background .15s ease, transform .1s ease;
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn:active{ transform:scale(.94); }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn-add{
    background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);
    box-shadow:var(--shadow);
  }
  .icon-btn-add:hover{ background:var(--accent); filter:brightness(1.08); }
  /* Op verzoek is het + knopje 1,5x zo groot gemaakt; het rondje eromheen groeit mee zodat de
     verhouding (en dus de ruimte rond het icoontje) gelijk blijft. */
  .icon-btn-add{ width:57px; height:57px; }
  .icon-btn-add svg{ width:32px; height:32px; }
  .icon-btn-filter-active{
    background:var(--secondary); border-color:var(--secondary); color:#fff;
  }
  .icon-btn-filter-active:hover{ background:var(--secondary); filter:brightness(1.08); }
  /* Het vraagteken-icoontje (validatiefilter) is extra klein van vorm (een rondje met een dun
     vraagtekentje erin), dus bij dezelfde maat als de andere knopjes oogt het minder duidelijk.
     Eerst al iets groter gemaakt, en op verzoek nu nog eens 1,5x zo groot — het rondje eromheen
     groeit mee zodat het icoontje niet buiten de knop uitsteekt. */
  .icon-btn-validatie{ width:57px; height:57px; }
  .icon-btn-validatie svg{ width:33px; height:33px; stroke-width:2.4; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 18px; border-radius:999px; border:1px solid transparent;
    font-size:1rem; font-weight:600; cursor:pointer; white-space:nowrap;
    transition:transform .1s ease, filter .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--accent); color:var(--accent-contrast); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-secondary{ background:var(--secondary-soft); color:var(--secondary); }
  .btn-ghost{ background:transparent; color:var(--text); border-color:var(--border); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }
  .btn-danger-solid{ background:var(--danger); color:#fff; }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 14px; font-size:.95rem; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }

  .stat-strip{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin:16px 0; }
  .stat{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    width:100%; font-family:inherit; -webkit-appearance:none; appearance:none;
    background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--accent); border-radius:var(--radius-sm);
    padding:10px 3px 8px; text-align:center; box-shadow:var(--shadow); cursor:pointer;
    transition:transform .12s ease, border-color .15s ease;
  }
  .stat:hover{ transform:translateY(-1px); border-color:var(--accent); }
  .stat:active{ transform:translateY(0); }
  .stat b{ display:block; font-family:var(--font-display); font-size:1.2rem; font-variant-numeric:tabular-nums; color:var(--accent); line-height:1; }
  .stat-ic-badge{
    display:flex; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:50%; background:var(--accent); margin-bottom:1px;
    outline:1.5px dashed var(--border); outline-offset:2px;
  }
  .stat-ic-badge .ic{ width:18px; height:18px; color:#fff; }
  .stat:nth-child(2){ border-top-color:var(--secondary); }
  .stat:nth-child(2) b{ color:var(--secondary); }
  .stat:nth-child(2) .stat-ic-badge{ background:var(--secondary); }
  .stat:nth-child(3){ border-top-color:var(--tertiary); }
  .stat:nth-child(3) b{ color:var(--tertiary); }
  .stat:nth-child(3) .stat-ic-badge{ background:var(--tertiary); }
  .stat:nth-child(4){ border-top-color:var(--km-accent); }
  .stat:nth-child(4) b{ color:var(--km-accent); }
  .stat:nth-child(4) .stat-ic-badge{ background:var(--km-accent); }
  .stat:nth-child(5){ border-top-color:var(--concert-accent); }
  .stat:nth-child(5) b{ color:var(--concert-accent); }
  .stat:nth-child(5) .stat-ic-badge{ background:var(--concert-accent); }
  /* Met de icoonmaat terug naar 80% van de vorige stap passen de badges prima in 3 kolommen. */
  @media (max-width:600px) and (orientation:portrait){
    .stat-ic-badge{ width:32px; height:32px; }
    .stat-ic-badge .ic{ width:18px; height:18px; }
  }

  .search-field{ position:relative; margin-bottom:12px; }
  .search-field input[type=search]{ padding-left:44px; }
  .search-field svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--text-muted); pointer-events:none; }

  .map-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 14px 10px; box-shadow:var(--shadow); margin-bottom:18px; }
  .map-card h2{ font-size:1.05rem; margin-bottom:2px; }
  .map-sub{ color:var(--text-muted); font-size:.92rem; margin-bottom:8px; }
  .map-wrap{ position:relative; width:100%; border-radius:var(--radius-sm); overflow:hidden; background:var(--map-ocean); touch-action:none; }
  .map-zoom-inner{ transform-origin:0 0; }
  .map-zoom-inner svg{ display:block; width:100%; height:auto; }
  .map-landmass{ fill:var(--map-land); stroke:var(--map-land-border); stroke-width:0.6; stroke-linejoin:round; }
  .map-pin{ stroke:var(--pin-stroke); stroke-width:0.9; stroke-linejoin:round; cursor:pointer; }
  .map-pin:hover{ opacity:.85; }
  .map-zoom-controls{
    position:absolute; right:8px; bottom:8px; z-index:2;
    display:flex; align-items:center; gap:1px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .map-zoom-btn{
    -webkit-appearance:none; appearance:none; border:none; background:transparent; color:var(--text);
    width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:.78rem; font-weight:600; font-family:inherit; padding:0;
  }
  .map-zoom-btn svg{ width:16px; height:16px; }
  .map-zoom-btn:hover{ background:var(--surface-2); }
  .map-zoom-btn:active{ background:var(--border); }
  .map-zoom-btn + .map-zoom-btn{ border-left:1px solid var(--border); }
  .map-zoom-reset{ min-width:38px; }
  .map-legend{ display:flex; align-items:center; gap:4px 9px; font-size:.85rem; color:var(--text-muted); margin-top:8px; flex-wrap:wrap; }
  .legend-item{ display:inline-flex; align-items:center; gap:3px; white-space:nowrap; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
  .legend-pin{ display:inline-block; flex:none; width:10px; height:15px; }
  @media (max-width:340px){
    .map-legend{ font-size:.78rem; gap:4px 6px; }
  }

  /* Een natief datumveld (dd/mm/jjjj met spinner) heeft in Chrome een vaste minimumbreedte die niet
     meeschaalt met een kleinere container; bij 2x lettertype past dat niet meer op een smalle
     telefoon. Dit veld blijft daarom op zijn eigen, iets kleinere maat — leesbaar genoeg voor een
     datum, zonder de pagina breder te maken dan het scherm. Moet NA de algemene input-regel hierboven
     staan om die te kunnen overschrijven. */
  @media (max-width:600px) and (orientation:portrait){
    input[type=date]{ font-size:17px; }
  }
  /* Een lang (eventueel zelf toegevoegd) optie-label past bij 2x lettertype soms niet meer als
     aaneengesloten tekst in een chip op een smalle telefoon; laat het dan over twee regels lopen
     in plaats van de pagina breder te maken dan het scherm. */
  @media (max-width:600px) and (orientation:portrait){
    .chip{ white-space:normal; overflow-wrap:anywhere; }

  /* Een knop met een langere tekst (zoals "Openen in Excel (.html)") past bij 2x lettertype niet
     meer op één regel op een smalle telefoon; laat de tekst dan over twee regels lopen in plaats
     van de pagina breder te maken dan het scherm. */
  @media (max-width:600px) and (orientation:portrait){

  /* Bij 2x lettertype is er in de bovenbalk en in lijstrijen te weinig breedte om een langere

  /* ============================== DESKTOP: RUIMTE ECHT BENUTTEN ==============================
     Op de telefoon blijven lijsten en kaarten gewoon onder elkaar staan (dat werkt al goed).
     Vanaf 900px breedte is er veel meer horizontale ruimte dan één dunne kolom kan gebruiken,
     dus daar gaan lijsten, het dashboard en detailvelden in meerdere kolommen vloeien zodat de
     app een echte desktop-indeling krijgt in plaats van een opgerekte telefoon-layout. */
  @media (min-width:900px){
    #searchResults{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; align-items:start; }
    #searchResults .list-row{ margin-bottom:0; }
    .group-section{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; align-items:start; }
    .group-section .group-header{ grid-column:1/-1; }
    .group-section .list-row{ margin-bottom:0; }

    .nav-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
    .stat-strip{ grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin:22px 0; }
    .stat{ padding:16px 6px 14px; }
    .map-card{ padding:20px 22px 16px; }

    .detail-grid{ grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
    .detail-meta{ grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }

    .year-trips{ display:flex; flex-direction:row; flex-wrap:wrap; }
    .year-trips .year-trip-chip{ width:calc(33.333% - 7px); }
  }
  @media (min-width:1300px){
    #searchResults, .group-section{ grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); }
    .year-trips .year-trip-chip{ width:calc(25% - 7.5px); }
  }

  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
</style>

var COUNTRY_BY_CODE = {};
var COUNTRY_BY_NAME = {};
var COUNTRY_BY_NAME_NORM = {};
function normalizeCountryKey(s){
  // Verwijdert accenten/tremas (bv. "Kroatie" -> "kroatie", "België" -> "belgie") zodat landnamen
  // ook herkend worden als iemand ze zonder speciale tekens intikt (lastig te typen op een gsm).
  var str = String(s||"").toLowerCase().trim();
  if(str.normalize) str = str.normalize("NFD").replace(new RegExp("[\\u0300-\\u036f]", "g"), "");
  return str;
}
COUNTRIES.forEach(function(c){
  COUNTRY_BY_CODE[c.code]=c;
  COUNTRY_BY_NAME[c.name.toLowerCase()]=c;
  var norm = normalizeCountryKey(c.name);
  if(!COUNTRY_BY_NAME_NORM[norm]) COUNTRY_BY_NAME_NORM[norm]=c;
});
function findCountryByName(raw){
  if(!raw) return null;
  return COUNTRY_BY_NAME[String(raw).toLowerCase().trim()] || COUNTRY_BY_NAME_NORM[normalizeCountryKey(raw)] || null;
}

function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function flagEmoji(code){
  if(!code) return "🌍";
  var c = COUNTRY_BY_CODE[code];
  if(c && c.flag) return c.flag;
  if(code.length!==2) return "🌍";
  var upper = code.toUpperCase();
  var cps = [];
  for(var i=0;i<2;i++) cps.push(127397 + upper.charCodeAt(i));
  try{ return String.fromCodePoint.apply(String, cps); }catch(e){ return "🌍"; }
}
function countryLabel(codeOrName, fallbackName){
  var c = COUNTRY_BY_CODE[codeOrName];
  if(c) return c.name;
  return fallbackName || codeOrName || "Onbekend land";
}
function todayStr(){
  var d = new Date();
  function pad(n){ n=String(n); return n.length<2 ? "0"+n : n; }
  return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();
}
function fmtISODate(iso){
  if(!iso) return "";
  var parts = String(iso).split("-");
  if(parts.length!==3) return iso;
  return parts[2]+"/"+parts[1]+"/"+parts[0];
}
function computeDagen(vanDatum, totDatum){
  if(!vanDatum || !totDatum) return "";
  var v = new Date(vanDatum+"T00:00:00"), t = new Date(totDatum+"T00:00:00");
  if(isNaN(v.getTime()) || isNaN(t.getTime())) return "";
  var days = Math.round((t.getTime()-v.getTime())/86400000)+1;
  return days>0 ? days : "";
}

function qsFromHash(){
  var hash = location.hash || "";
  var qi = hash.indexOf("?");
  var out = {};
  if(qi===-1) return out;
  var qs = hash.slice(qi+1);
  qs.split("&").forEach(function(p){
    if(!p) return;
    var kv = p.split("=");
    out[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]||"");
  });
  return out;
}
function qsToQueryString(qs){
  var parts = [];
  Object.keys(qs).forEach(function(k){ if(qs[k]) parts.push(encodeURIComponent(k)+"="+encodeURIComponent(qs[k])); });
  return parts.length ? "?"+parts.join("&") : "";
}
function pathFromHash(){
  var hash = (location.hash || "#/").slice(1);
  var qi = hash.indexOf("?");
  return qi===-1 ? hash : hash.slice(0,qi);
}
function navigate(path){ location.hash = path; }

var toastTimer = null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  var duration = Math.min(7000, Math.max(2800, msg.length*70));
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, duration);
}

function closeModal(){
  var m = document.getElementById("modal-overlay");
  if(m) m.remove();
}
function openModal(html){
  closeModal();
  var wrap = document.createElement("div");
  wrap.id = "modal-overlay";
  wrap.className = "modal-overlay";
  wrap.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  wrap.addEventListener("click", function(e){ if(e.target===wrap) closeModal(); });
  document.body.appendChild(wrap);
  document.addEventListener("keydown", escCloseOnce);
}
function escCloseOnce(e){ if(e.key==="Escape"){ closeModal(); document.removeEventListener("keydown", escCloseOnce); } }

function confirmDialog(title, message, confirmLabel, onConfirm, danger){
  openModal(
    '<h3>'+esc(title)+'</h3>'+
    '<p>'+esc(message)+'</p>'+
    '<div class="modal-actions">'+
      '<button class="btn btn-ghost" data-action="modal-cancel">Annuleren</button>'+
      '<button class="btn '+(danger?'btn-danger-solid':'btn-primary')+'" id="modal-confirm-btn">'+esc(confirmLabel)+'</button>'+
    '</div>'
  );
  document.getElementById("modal-confirm-btn").addEventListener("click", function(){
    closeModal();
    onConfirm();
  });
}

function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 1280; quality = quality || 0.82;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("Kan bestand niet lezen")); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error("Kan afbeelding niet laden")); };
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h * (maxDim/w)); w = maxDim; }
          else { w = Math.round(w * (maxDim/h)); h = maxDim; }
        }
        var canvas = document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        var dataUrl;
        try{ dataUrl = canvas.toDataURL("image/jpeg", quality); }
        catch(e){ dataUrl = reader.result; }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
/* ============================== OPSLAG (Supabase) ==============================
   Vervangt de vroegere IndexedDB-opslag door een Supabase-database, zodat dezelfde
   data op elk apparaat (pc, laptop, GSM) beschikbaar is. Alle 13 "collecties" (reizen,
   ideeën, key moments, to-do's/bucket-list, concerts, contacts en de custom-optielijsten)
   leven in één generieke tabel "records" met kolommen (user_id, collection, id, data) —
   dat sluit precies aan op hoe de rest van de app al met "storeName" werkt, en Row Level
   Security zorgt dat iedereen alleen zijn eigen data ziet. Let op: dit bestand bevat
   bewust alleen de PUBLISHABLE (anon) key, nooit de secret key — die geeft namelijk
   volledige toegang zonder enige beveiliging en hoort nooit in code die publiek op
   GitHub staat. */

var SUPABASE_ANON_KEY = "sb_publishable_z62ATo7xoQgBzRrU2VR73g_xeB_gCoR";

function currentUserId(){
  return sb.auth.getSession().then(function(res){
    var session = res.data && res.data.session;
    if(!session) throw new Error("Niet ingelogd.");
    return session.user.id;
  });
}
function dbGetAll(storeName){
  return sb.from("records").select("data").eq("collection", storeName).then(function(res){
    if(res.error) throw res.error;
    return (res.data||[]).map(function(row){ return row.data; });
  });
}
function dbAdd(storeName, obj){
  return currentUserId().then(function(uid){
    return sb.from("records").insert({user_id:uid, collection:storeName, id:obj.id, data:obj}).then(function(res){
      if(res.error) throw res.error;
      return obj.id;
    });
  });
}
function dbPut(storeName, obj){
  return currentUserId().then(function(uid){
    return sb.from("records").upsert({user_id:uid, collection:storeName, id:obj.id, data:obj}, {onConflict:"user_id,collection,id"}).then(function(res){
      if(res.error) throw res.error;
      return obj.id;
    });
  });
}
function dbGet(storeName, id){
  return sb.from("records").select("data").eq("collection", storeName).eq("id", id).maybeSingle().then(function(res){
    if(res.error) throw res.error;
    return res.data ? res.data.data : null;
  });
}
function dbDelete(storeName, id){
  return sb.from("records").delete().eq("collection", storeName).eq("id", id).then(function(res){
    if(res.error) throw res.error;
  });
}
function dbClear(storeName){
  return sb.from("records").delete().eq("collection", storeName).then(function(res){
    if(res.error) throw res.error;
  });
}
function nextId(storeName, base){
  return dbGetAll(storeName).then(function(rows){
    var max = base-1;
    rows.forEach(function(r){ if(r.id && r.id>max) max=r.id; });
    return max+1;
  });
}
function addWithId(storeName, base, obj){
  return nextId(storeName, base).then(function(id){
    obj.id = id;
    return dbAdd(storeName, obj).then(function(){ return id; });
  });
}

/* ============================== WERELDKAART ============================== */
function mapProject(lon, lat, W, H){
  return [ ((lon+180)/360)*W, ((90-lat)/180)*H ];
}
function buildLandmassPaths(W, H){
  var parts = [];
  LANDMASSES.forEach(function(flat){
    var d = "";
    for(var i=0;i<flat.length;i+=2){
      var p = mapProject(flat[i], flat[i+1], W, H);
      d += (i===0 ? "M" : "L") + p[0].toFixed(1) + " " + p[1].toFixed(1) + " ";
    }
    d += "Z";
    parts.push('<path d="'+d+'" class="map-landmass"></path>');
  });
  return parts.join("");
}
var MAP_PIN_D = "M0,0 C-1,-3 -7,-9 -7,-13 A7,7 0 1,1 7,-13 C7,-9 1,-3 0,0 Z";
function legendPin(colorVar){
  return '<svg class="legend-pin" viewBox="-8 -22 16 24" width="12" height="18" aria-hidden="true"><path d="'+MAP_PIN_D+'" fill="'+colorVar+'" stroke="var(--pin-stroke)" stroke-width="0.9"></path></svg>';
}
function mapPinHtml(x, y, scale, colorVar, code, title){
  return '<path d="'+MAP_PIN_D+'" fill="'+colorVar+'" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+scale.toFixed(2)+')" data-code="'+code+'" class="map-pin map-dot-visited"><title>'+title+'</title></path>';
}
function buildWorldMap(counts){
  // counts: {code: aantal}
  var W = 1000, H = 460;
  var dots = [];
  var pinsByTier = { 1:[], 2:[], 3:[] };
  COUNTRIES.forEach(function(c){
    if(c.continent==="Antarctica") return; // buiten beeld gelaten, komt anders onderin te staan
    var p = mapProject(c.lon, c.lat, W, H);
    var x = p[0], y = p[1];
    var n = counts[c.code] || 0;
    var title = esc(c.name) + (n>0 ? " — " + n + "x bezocht" : " — nog niet bezocht");
    if(n>0){
      var tier = n>=5 ? 3 : (n>=2 ? 2 : 1); // 1=Geweest (1x), 2=Vaker geweest (2-4x), 3=Vaak geweest (5x+)
      pinsByTier[tier].push({ x:x, y:y, code:c.code, title:title });
    } else {
      dots.push('<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.6" fill="var(--map-dot-neutral)" fill-opacity="0.85" data-code="'+c.code+'" class="map-dot"><title>'+title+'</title></circle>');
    }
  });
  var pinScale = 1.15;
  var pins = [];
  // laagste aantal-tier eerst tekenen, hoogste (donkerbruin) bovenop bij overlap
  [1,2,3].forEach(function(tier){
    var colorVar = tier===1 ? "var(--pin-1x)" : (tier===2 ? "var(--pin-2x)" : "var(--pin-3x)");
    pinsByTier[tier].forEach(function(pt){
      pins.push(mapPinHtml(pt.x, pt.y, pinScale, colorVar, pt.code, pt.title));
    });
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wereldkaart met bezochte landen">'+
    buildLandmassPaths(W, H) + dots.join("") + pins.join("") +
    '</svg>';
}

/* ============================== WERELDKAART: IN-/UITZOOMEN EN SLEPEN ============================== */
var MAP_ZOOM_MIN = 1, MAP_ZOOM_MAX = 4;
var mapZoom = { scale:1, x:0, y:0 };
var mapZoomPointers = {}; // actieve pointers tijdens slepen/knijpen, per pointerId
var mapZoomDrag = null;   // { id, startX, startY, startTx, startTy } tijdens 1-vinger slepen
var mapZoomPinch = null;  // { dist, scale, midX, midY } tijdens 2-vinger knijpen
var mapZoomMoved = false; // onderscheid tik vs. sleep, om per ongeluk navigeren na slepen te voorkomen

function initMapZoom(){
  mapZoom.scale = 1; mapZoom.x = 0; mapZoom.y = 0;
  applyMapZoom();
}
function applyMapZoom(){
  var inner = document.getElementById("mapZoomInner");
  if(inner) inner.style.transform = "translate("+mapZoom.x.toFixed(1)+"px,"+mapZoom.y.toFixed(1)+"px) scale("+mapZoom.scale.toFixed(3)+")";
  var label = document.getElementById("mapZoomLabel");
  if(label) label.textContent = Math.round(mapZoom.scale*100)+"%";
}
function clampMapZoom(){
  var wrap = document.getElementById("mapWrap");
  if(!wrap) return;
  var w = wrap.clientWidth, h = wrap.clientHeight;
  var maxX = 0, minX = Math.min(0, w - w*mapZoom.scale);
  var maxY = 0, minY = Math.min(0, h - h*mapZoom.scale);
  mapZoom.x = Math.max(minX, Math.min(maxX, mapZoom.x));
  mapZoom.y = Math.max(minY, Math.min(maxY, mapZoom.y));
}
// Zoomt in/uit met (px,py) — coördinaten t.o.v. de map-wrap — als vast ankerpunt, zodat
// precies dat punt van de kaart onder de vinger/cursor blijft staan tijdens het zoomen.
function mapZoomAt(px, py, factor){
  var newScale = Math.max(MAP_ZOOM_MIN, Math.min(MAP_ZOOM_MAX, mapZoom.scale*factor));
  if(newScale === mapZoom.scale) return;
  var cx = (px - mapZoom.x) / mapZoom.scale;
  var cy = (py - mapZoom.y) / mapZoom.scale;
  mapZoom.scale = newScale;
  mapZoom.x = px - cx*newScale;
  mapZoom.y = py - cy*newScale;
  if(newScale <= MAP_ZOOM_MIN + 0.001){ mapZoom.x = 0; mapZoom.y = 0; }
  clampMapZoom();
  applyMapZoom();
}
function mapWrapCenter(wrap){
  var r = wrap.getBoundingClientRect();
  return [r.width/2, r.height/2];
}
function pointerDistance(a, b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function pointerMidpoint(a, b, rect){ return [ (a.x+b.x)/2 - rect.left, (a.y+b.y)/2 - rect.top ]; }

document.addEventListener("wheel", function(e){
  var wrap = e.target.closest && e.target.closest("#mapWrap");
  if(!wrap) return;
  e.preventDefault();
  var r = wrap.getBoundingClientRect();
  var factor = e.deltaY < 0 ? 1.2 : 1/1.2;
  mapZoomAt(e.clientX - r.left, e.clientY - r.top, factor);
}, { passive:false });

document.addEventListener("pointerdown", function(e){
  var wrap = e.target.closest && e.target.closest("#mapWrap");
  if(!wrap) return;
  var r = wrap.getBoundingClientRect();
  mapZoomPointers[e.pointerId] = { x:e.clientX, y:e.clientY };
  var ids = Object.keys(mapZoomPointers);
  if(ids.length === 1){
    mapZoomMoved = false;
    mapZoomDrag = { id:e.pointerId, startX:e.clientX, startY:e.clientY, startTx:mapZoom.x, startTy:mapZoom.y };
    mapZoomPinch = null;
  } else if(ids.length === 2){
    mapZoomDrag = null;
    var pts = ids.map(function(id){ return mapZoomPointers[id]; });
    mapZoomPinch = { dist:pointerDistance(pts[0], pts[1]), scale:mapZoom.scale, rect:r };
  }
});
document.addEventListener("pointermove", function(e){
  if(!(e.pointerId in mapZoomPointers)) return;
  mapZoomPointers[e.pointerId] = { x:e.clientX, y:e.clientY };
  var ids = Object.keys(mapZoomPointers);
  if(ids.length === 2 && mapZoomPinch){
    var pts = ids.map(function(id){ return mapZoomPointers[id]; });
    var newDist = pointerDistance(pts[0], pts[1]);
    var mid = pointerMidpoint(pts[0], pts[1], mapZoomPinch.rect);
    var targetScale = Math.max(MAP_ZOOM_MIN, Math.min(MAP_ZOOM_MAX, mapZoomPinch.scale * (newDist/mapZoomPinch.dist)));
    mapZoomAt(mid[0], mid[1], targetScale/mapZoom.scale);
    mapZoomMoved = true;
  } else if(mapZoomDrag && e.pointerId === mapZoomDrag.id && mapZoom.scale > MAP_ZOOM_MIN){
    var dx = e.clientX - mapZoomDrag.startX, dy = e.clientY - mapZoomDrag.startY;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) mapZoomMoved = true;
    mapZoom.x = mapZoomDrag.startTx + dx;
    mapZoom.y = mapZoomDrag.startTy + dy;
    clampMapZoom();
    applyMapZoom();
  }
});
function mapZoomPointerEnd(e){
  delete mapZoomPointers[e.pointerId];
  var ids = Object.keys(mapZoomPointers);
  if(ids.length < 2) mapZoomPinch = null;
  if(ids.length === 0) mapZoomDrag = null;
}
document.addEventListener("pointerup", mapZoomPointerEnd);
document.addEventListener("pointercancel", mapZoomPointerEnd);

/* ============================== CSV: GENERIEKE INFRASTRUCTUUR ============================== */
function csvEscape(v, delimiter){
  var s = (v===null||v===undefined) ? "" : String(v);
  var re = new RegExp('["'+delimiter+'\\r\\n]');
  if(re.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function rowsToCSV(headers, rows){
  // Puntkomma als scheidingsteken: dit is de standaard lijstscheiding in de Nederlandse/Belgische
  // Excel-regio-instelling (waar de komma het decimaalteken is). In combinatie met de UTF-8 BOM
  // hieronder opent Excel het bestand zo altijd met de juiste kolommen én correcte tekens (ë, é, ï, …).
  var delimiter = ";";
  var lines = [headers.map(function(v){ return csvEscape(v, delimiter); }).join(delimiter)];
  rows.forEach(function(r){ lines.push(r.map(function(v){ return csvEscape(v, delimiter); }).join(delimiter)); });
  return "﻿sep=" + delimiter + "\r\n" + lines.join("\r\n") + "\r\n";
}
/* ============================== EXCEL (HTML-tabel): GENERIEKE INFRASTRUCTUUR ============================== */
// De downloads-mogelijkheid van dit platform staat alleen een vaste lijst bestandsextensies toe
// (o.a. txt, csv, html, pdf) -- een los, "echt" .xlsx-bestand zit daar niet bij. Een HTML-tabel met
// een expliciete UTF-8-meta is wél toegestaan én wordt door Excel, Google Sheets en Numbers correct
// geopend via "Bestand > Openen" -- inclusief tekens als ë/é/ï, zonder enige encoding-onzekerheid
// (dat is precies wat bij CSV in Excel soms misgaat, omdat Excel dan zelf de tekencodering moet raden).
function excelHtmlEscape(v){
  return esc(v===null||v===undefined?"":String(v));
}
function rowsToExcelHtmlString(headers, rows, title){
  var theadHtml = '<tr>'+headers.map(function(h){ return '<th>'+excelHtmlEscape(h)+'</th>'; }).join("")+'</tr>';
  var tbodyHtml = rows.map(function(r){
    return '<tr>'+r.map(function(v){ return '<td>'+excelHtmlEscape(v)+'</td>'; }).join("")+'</tr>';
  }).join("");
  return '<!DOCTYPE html>'+
    '<html xmlns:x="urn:schemas-microsoft-com:office:excel">'+
    '<head><meta charset="UTF-8"><title>'+excelHtmlEscape(title)+'</title>'+
    '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'+
    '<x:Name>'+excelHtmlEscape(title)+'</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>'+
    '</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'+
    '<style>'+
      'body{font-family:Calibri,Arial,sans-serif;}'+
      'table{border-collapse:collapse;}'+
      'th,td{border:1px solid #ccc; padding:4px 8px; text-align:left; white-space:pre-wrap; mso-number-format:"\@";}'+
      'th{background:#f0f0f0; font-weight:bold;}'+
    '</style></head>'+
    '<body><table>'+
      '<thead>'+theadHtml+'</thead>'+
      '<tbody>'+tbodyHtml+'</tbody>'+
    '</table></body></html>';
}

function parseCSV(text, delimiter){
  delimiter = delimiter || ",";
  var rows = [];
  var row = [];
  var field = "";
  var inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === delimiter){ row.push(field); field=""; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return !(r.length===1 && r[0]==="" ); });
}
function normHeader(h){ return String(h||"").trim().toLowerCase(); }
function prepareImportText(text){
  // Verwijder BOM en herken een eventuele "sep=" regel (die Excel zelf toevoegt/verwacht).
  text = text.replace(/^﻿/, "");
  var sepMatch = text.match(/^sep=(.)\r?\n/);
  var forcedDelimiter = null;
  if(sepMatch){ forcedDelimiter = sepMatch[1]; text = text.slice(sepMatch[0].length); }
  var delimiter = forcedDelimiter;
  if(!delimiter){
    var firstLine = text.split(/\r\n|\n/)[0] || "";
    var commas = (firstLine.match(/,/g)||[]).length;
    var semicolons = (firstLine.match(/;/g)||[]).length;
    var tabs = (firstLine.match(/\t/g)||[]).length;
    delimiter = ",";
    if(semicolons > commas && semicolons >= tabs) delimiter = ";";
    else if(tabs > commas && tabs > semicolons) delimiter = "\t";
  }
  return { text: text, delimiter: delimiter };
}
function capFirst(s){ if(!s) return s; return s.charAt(0).toUpperCase()+s.slice(1); }

/* ============================== DOWNLOADS (Artifact-capability met terugval) ============================== */
function toUtf8Bytes(content){
  // Zelf de exacte UTF-8-bytes opbouwen (i.p.v. te vertrouwen op impliciete string->UTF-8-omzetting
  // ergens in het opslagpad) zodat tekens als ë/é/ï in landnamen (bv. België, Italië) altijd correct
  // worden weggeschreven, ongeacht hoe het downloadmechanisme strings zou kunnen verwerken.
  try{ return new TextEncoder().encode(content); }catch(e){ return null; }
}
function offerDownload(filename, content){
  if(!window.claude || !window.claude.use){ showTextFallback(filename, content); return; }
  window.claude.use("downloads").then(function(downloads){
    if(!downloads){ showTextFallback(filename, content); return; }
    var payload = toUtf8Bytes(content) || content;
    downloads.save({filename:filename, data:payload}).then(function(){
      toast("'"+filename+"' opgeslagen.");
    }).catch(function(err){
      var code = err && err.code;
      if(code==="extension_not_enabled" || code==="rejected_extension"){
        var origExt = (filename.match(/\.[^.]+$/)||[""])[0];
        var altName = filename.replace(/\.[^.]+$/, ".txt");
        downloads.save({filename:altName, data:payload}).then(function(){
          toast("Opgeslagen als '"+altName+"' — hernoem de extensie naar '"+origExt+"'.");
        }).catch(function(){ showTextFallback(filename, content); });
      } else if(code==="declined"){
        toast("Downloaden geannuleerd.");
      } else if(code==="rate_limited"){
        toast("Er loopt al een downloadverzoek — probeer het nog eens.");
      } else {
        showTextFallback(filename, content);
      }
    });
  }).catch(function(){ showTextFallback(filename, content); });
}
function showTextFallback(filename, content){
  var ext = (filename.match(/\.[^.]+$/)||[""])[0];
  openModal(
    '<h3>'+esc(filename)+'</h3>'+
    '<p>Automatisch opslaan lukt hier niet. Selecteer de tekst hieronder, kopieer hem en plak in een nieuw tekstbestand met extensie '+esc(ext)+'.</p>'+
    '<textarea class="csv-dump" readonly>'+esc(content)+'</textarea>'+
    '<div class="modal-actions"><button class="btn btn-primary" data-action="modal-cancel">Sluiten</button></div>'
  );
  var ta = document.querySelector(".csv-dump");
  if(ta){ ta.focus(); ta.select(); }
}
/* ============================== CSV: PER TABEL ============================== */
function parseNLDateToISO(s){
  s = String(s||"").trim();
  var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(!m) return "";
  var dd = m[1].length<2?"0"+m[1]:m[1], mm = m[2].length<2?"0"+m[2]:m[2];
  return m[3]+"-"+mm+"-"+dd;
}
function metaCols(x){
  return [x.toegevoegd||"", x.toegevoegdDoor||"", x.gewijzigd||"", x.gewijzigdDoor||""];
}
function metaHeaders(){ return ["Toegevoegd","Toegevoegd door","Gewijzigd","Gewijzigd door"]; }
function metaIdx(headerRow){
  return { toegevoegd: headerRow.indexOf("toegevoegd"), toegevoegddoor: headerRow.indexOf("toegevoegd door"), gewijzigd: headerRow.indexOf("gewijzigd"), gewijzigddoor: headerRow.indexOf("gewijzigd door") };
}
function fotoUrlForExport(x){
  // Alleen een foto-URL (van internet) gaat mee in de export; een geüploade foto (data:-URI)
  // is te groot/niet-portable voor CSV en wordt overgeslagen.
  return (x.foto && String(x.foto).indexOf("data:")!==0) ? x.foto : "";
}
function isHttpUrl(s){ return /^https?:\/\//i.test(String(s||"").trim()); }
function describeSkipReasons(reasons){
  var LABELS = { land:" zonder land", jaar:" zonder geldig jaar", duur:" met onbekende 'Duur'", type:" met onbekend of ontbrekend 'Type'", omschrijving:" zonder omschrijving", todo:" zonder 'Bucket-list item'", shortname:" zonder 'Short-name'" };
  var parts = [];
  Object.keys(reasons).forEach(function(k){ if(reasons[k]) parts.push(reasons[k]+(LABELS[k]||(" ("+k+")"))); });
  return parts.join(", ");
}

/* ---- REIZEN ---- */
function tripsRows(trips){
  var headers = ["Id","Land","Plaatsen","Groep","Jaar","Maand","Van datum","Tot datum","Dagen","Duur","Type","Opmerkingen","Met wie","Organisatie","Beoordeling","Validatie"].concat(metaHeaders());
  var rows = trips.map(function(t){
    return [t.id||"", countryLabel(t.landCode,t.landNaam), t.plaatsen||"", t.groep||"", t.jaar||"", t.maand||"", fmtISODate(t.vanDatum), fmtISODate(t.totDatum), computeDagen(t.vanDatum,t.totDatum), t.duur||"", t.type||"", t.opmerkingen||"", t.metWie||"", t.organisatie||"", t.beoordeling||"", t.validatie||""].concat(metaCols(t));
  });
  return { headers:headers, rows:rows };
}
function tripsToCSVString(trips){ var hr = tripsRows(trips); return rowsToCSV(hr.headers, hr.rows); }
function tripsToExcelHtmlString(trips){ var hr = tripsRows(trips); return rowsToExcelHtmlString(hr.headers, hr.rows, "Reizen"); }
function importTripsCSV(text){
  return getTripTypes().then(function(allTripTypes){
    return getTripDuurOptions().then(function(allDuur){
      var prep = prepareImportText(text);
      var rows = parseCSV(prep.text, prep.delimiter);
      if(rows.length<1) return {added:0, updated:0, skipped:0, reasons:{}, noHeaderMatch:true};
      var headerRow = rows[0].map(normHeader);
      var idx = {
        id: headerRow.indexOf("id"), land: headerRow.indexOf("land"), plaatsen: headerRow.indexOf("plaatsen"),
        groep: headerRow.indexOf("groep"),
        jaar: headerRow.indexOf("jaar"), maand: headerRow.indexOf("maand"),
        vandatum: headerRow.indexOf("van datum"), totdatum: headerRow.indexOf("tot datum"),
        duur: headerRow.indexOf("duur"), type: headerRow.indexOf("type"),
        beoordeling: headerRow.indexOf("beoordeling"),
        metwie: headerRow.indexOf("met wie"), organisatie: headerRow.indexOf("organisatie"),
        opmerkingen: headerRow.indexOf("opmerkingen"), validatie: headerRow.indexOf("validatie")
      };
      var mi = metaIdx(headerRow);
      var noHeaderMatch = idx.land===-1 && idx.jaar===-1 && idx.duur===-1 && idx.type===-1;
      var added=0, updated=0, skipped=0, reasons={land:0,jaar:0,duur:0,type:0}, chain=Promise.resolve();
      rows.slice(1).forEach(function(row){
        if(row.every(function(c){return c==="";})) return;
        var landRaw = idx.land>=0 ? (row[idx.land]||"").trim() : "";
        var jaarRaw = idx.jaar>=0 ? (row[idx.jaar]||"").trim() : "";
        var jaar = /^onbekend$/i.test(jaarRaw) ? "Onbekend" : parseInt(jaarRaw,10);
        var duur = idx.duur>=0 ? (row[idx.duur]||"").trim() : "";
        var type = idx.type>=0 ? (row[idx.type]||"").trim() : "";
        if(!landRaw){ skipped++; reasons.land++; return; }
        if(!jaar){ skipped++; reasons.jaar++; return; }
        if(allDuur.indexOf(duur)===-1){ skipped++; reasons.duur++; return; }
        if(allTripTypes.indexOf(type)===-1){ skipped++; reasons.type++; return; }
        var c = findCountryByName(landRaw);
        var beoordelingVal = idx.beoordeling>=0 ? parseInt(row[idx.beoordeling],10) : NaN;
        var validatieRaw = idx.validatie>=0 ? (row[idx.validatie]||"").trim() : "";
        var fields = {
          landCode: c?c.code:null, landNaam: landRaw,
          plaatsen: idx.plaatsen>=0?row[idx.plaatsen]:"", groep: idx.groep>=0?row[idx.groep]:"", jaar: jaar,
          maand: idx.maand>=0?row[idx.maand]:"",
          vanDatum: idx.vandatum>=0 ? parseNLDateToISO(row[idx.vandatum]) : "",
          totDatum: idx.totdatum>=0 ? parseNLDateToISO(row[idx.totdatum]) : "",
          duur: duur, type: type,
          beoordeling: (beoordelingVal>=1 && beoordelingVal<=5) ? beoordelingVal : null,
          metWie: idx.metwie>=0?row[idx.metwie]:"", organisatie: idx.organisatie>=0?row[idx.organisatie]:"",
          opmerkingen: idx.opmerkingen>=0?row[idx.opmerkingen]:"",
          validatie: VALIDATIE_OPTIONS.indexOf(validatieRaw)!==-1 ? validatieRaw : "To check"
        };
        var csvToegevoegd = mi.toegevoegd>=0?row[mi.toegevoegd]:"", csvToegevoegdDoor = mi.toegevoegddoor>=0?row[mi.toegevoegddoor]:"";
        var idRaw = idx.id>=0 ? parseInt(row[idx.id],10) : NaN;
        chain = chain.then(function(){
          var existingP = idRaw ? dbGet("trips", idRaw) : Promise.resolve(null);
          return existingP.then(function(existing){
            if(existing){
              var obj = Object.assign({}, fields, stampForImportUpdate(existing, csvToegevoegd, csvToegevoegdDoor), {id:existing.id});
              return dbPut("trips", obj).then(function(){ updated++; });
            } else {
              var obj2 = Object.assign({}, fields, stampForImportAdd(csvToegevoegd, csvToegevoegdDoor));
              return addWithId("trips", TRIP_ID_BASE, obj2).then(function(){ added++; });
            }
          });
        });
      });
      return chain.then(function(){ return {added:added, updated:updated, skipped:skipped, reasons:reasons, noHeaderMatch:noHeaderMatch}; });
    });
  });
}

/* ---- TO-DO'S ---- */
function todosRows(todos){
  var headers = ["Id","Bucket-list item","Land","Type","Idee van wie","Met wie","URL","Details en Opmerkingen","Indruk","Gedaan","Foto (URL)"].concat(metaHeaders());
  var rows = todos.map(function(t){
    return [t.id||"", t.todo||"", t.landCode?countryLabel(t.landCode,t.landNaam):(t.landNaam||""), t.type||"", t.ideeVan||"", t.metWie||"", t.url||"", t.details||"", t.indruk||"", t.gedaan||"", fotoUrlForExport(t)].concat(metaCols(t));
  });
  return { headers:headers, rows:rows };
}
function todosToCSVString(todos){ var hr = todosRows(todos); return rowsToCSV(hr.headers, hr.rows); }
function todosToExcelHtmlString(todos){ var hr = todosRows(todos); return rowsToExcelHtmlString(hr.headers, hr.rows, "Bucket-list"); }
function importTodosCSV(text){
  return getTodoTypes().then(function(allTypes){
    var prep = prepareImportText(text);
    var rows = parseCSV(prep.text, prep.delimiter);
    if(rows.length<1) return {added:0, updated:0, skipped:0, reasons:{}, noHeaderMatch:true};
    var headerRow = rows[0].map(normHeader);
    var idx = {
      id: headerRow.indexOf("id"), todo: headerRow.indexOf("to do"), land: headerRow.indexOf("land"),
      type: headerRow.indexOf("type"), ideevan: headerRow.indexOf("idee van wie"), metwie: headerRow.indexOf("met wie"),
      url: headerRow.indexOf("url"), details: headerRow.indexOf("details en opmerkingen"),
      indruk: headerRow.indexOf("indruk"), gedaan: headerRow.indexOf("gedaan"),
      foto: headerRow.indexOf("foto (url)")>=0 ? headerRow.indexOf("foto (url)") : headerRow.indexOf("foto")
    };
    var mi = metaIdx(headerRow);
    var noHeaderMatch = idx.todo===-1 && idx.type===-1;
    var added=0, updated=0, skipped=0, reasons={todo:0,type:0}, chain=Promise.resolve();
    rows.slice(1).forEach(function(row){
      if(row.every(function(c){return c==="";})) return;
      var todoRaw = idx.todo>=0 ? (row[idx.todo]||"").trim() : "";
      var type = idx.type>=0 ? (row[idx.type]||"").trim() : "";
      if(!todoRaw){ skipped++; reasons.todo++; return; }
      if(allTypes.indexOf(type)===-1){ skipped++; reasons.type++; return; }
      var landRaw = idx.land>=0 ? (row[idx.land]||"").trim() : "";
      var c = landRaw ? findCountryByName(landRaw) : null;
      var indrukVal = idx.indruk>=0 ? parseInt(row[idx.indruk],10) : NaN;
      var gedaanVal = idx.gedaan>=0 ? (row[idx.gedaan]||"").trim() : "";
      var csvFotoRawT = idx.foto>=0 ? (row[idx.foto]||"").trim() : "";
      var csvFotoT = isHttpUrl(csvFotoRawT) ? csvFotoRawT : "";
      var fields = {
        todo: todoRaw, landCode: c?c.code:null, landNaam: c?"":landRaw, type: type,
        ideeVan: idx.ideevan>=0?row[idx.ideevan]:"", metWie: idx.metwie>=0?row[idx.metwie]:"",
        url: idx.url>=0?row[idx.url]:"", details: idx.details>=0?row[idx.details]:"",
        indruk: (indrukVal>=1 && indrukVal<=5) ? indrukVal : null,
        gedaan: (gedaanVal==="Ja"||gedaanVal==="Nee") ? gedaanVal : "Nee"
      };
      var csvToegevoegd = mi.toegevoegd>=0?row[mi.toegevoegd]:"", csvToegevoegdDoor = mi.toegevoegddoor>=0?row[mi.toegevoegddoor]:"";
      var idRaw = idx.id>=0 ? parseInt(row[idx.id],10) : NaN;
      chain = chain.then(function(){
        var existingP = idRaw ? dbGet("todos", idRaw) : Promise.resolve(null);
        return existingP.then(function(existing){
          if(existing){
            var obj = Object.assign({}, fields, stampForImportUpdate(existing, csvToegevoegd, csvToegevoegdDoor), {id:existing.id, foto:csvFotoT||existing.foto||null});
            return dbPut("todos", obj).then(function(){ updated++; });
          } else {
            var obj2 = Object.assign({}, fields, stampForImportAdd(csvToegevoegd, csvToegevoegdDoor), {foto:csvFotoT||null});
            return addWithId("todos", TODO_ID_BASE, obj2).then(function(){ added++; });
          }
        });
      });
    });
    return chain.then(function(){ return {added:added, updated:updated, skipped:skipped, reasons:reasons, noHeaderMatch:noHeaderMatch}; });
  });
}

      chain = chain.then(function(){

var formPhotoData = null;

function topbar(title, backHash, actionsHtml){
  return '<div class="topbar">' +
    (backHash ? '<button class="icon-btn" data-action="nav" data-href="'+backHash+'" aria-label="Terug">'+ICONS.back+'</button>' : '') +
    '<h1>'+esc(title)+'</h1>' +

function validatieFilterBtn(basePath, qs){
  var active = qs.validatie === "To check";
  var newQs = Object.assign({}, qs);
  if(active){ delete newQs.validatie; } else { newQs.validatie = "To check"; }
  var href = basePath + qsToQueryString(newQs);
  return '<button class="icon-btn icon-btn-validatie'+(active?' icon-btn-filter-active':'')+'" data-action="nav" data-href="'+href+'" aria-label="'+(active?"Filter wissen, toon alles":"Toon alleen items met Validatie: To check")+'" aria-pressed="'+(active?"true":"false")+'" title="'+(active?"Filter wissen":"Toon alleen te controleren items")+'">'+ICONS.questionMark+'</button>';
}
function navCard(href, icon, title, sub){
  return '<button class="nav-card" data-action="nav" data-href="'+href+'"><span class="nav-ic-badge">'+icon+'</span><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></button>';

/* ============================== NAVIGATIE-CHROME (ZIJBALK + TABBALK) ==============================
   Eén lijst is de bron voor zowel de zijbalk (desktop, alle onderdelen) als de tabbalk (mobiel,
   alleen de belangrijkste + "Meer") — en dezelfde lijst bepaalt welk item actief gemarkeerd wordt
   bij elke render(), zodat je altijd ziet waar je bent, ook al vervangt render() alleen #root. */
var NAV_SECTIONS = [
  {href:"#/", icon:ICONS.home, label:"Dashboard", tabLabel:"Start", match:"/"},
  {href:"#/reizen", icon:ICONS.suitcase, label:"Alle Reizen", tabLabel:"Reizen", match:"/reizen", tab:true},
  {href:"#/jaaroverzicht", icon:ICONS.calendar, label:"Overzicht per jaar", match:"/jaaroverzicht"},
  {href:"#/ideetjes", icon:ICONS.bulb, label:"Reis ideetjes", match:"/ideetjes"},
  {href:"#/keymoments", icon:ICONS.star2, label:"Key Moments", tabLabel:"Key", match:"/keymoments", tab:true},
  {href:"#/todos", icon:ICONS.checklist, label:"Bucket-list", match:"/todos"},
  {href:"#/concerts", icon:ICONS.mic, label:"Concerts & more", tabLabel:"Shows", match:"/concerts", tab:true},
  {href:"#/contacts", icon:ICONS.users, label:"Contacts", match:"/contacts"},
  {href:"#/watmetwie", icon:ICONS.animalFox, label:"Wat met wie", match:"/watmetwie"},
  {divider:true},
  {href:"#/administratie", icon:ICONS.gear, label:"Administratie", match:"/administratie"}
];
function navItemActive(path, matchPath){
  if(matchPath==="/") return path==="" || path==="/";
  return path===matchPath || path.indexOf(matchPath+"/")===0;
}
function buildSidebarHtml(){
  var html = '<div class="sidebar-brand"><span class="flag-ic">🧭</span>My travels &amp; Adventures</div>';
  NAV_SECTIONS.forEach(function(s){
    if(s.divider){ html += '<div class="sidebar-divider"></div>'; return; }
    html += '<button type="button" class="sidebar-link" data-action="nav" data-href="'+s.href+'" data-match="'+s.match+'">'+s.icon+'<span>'+esc(s.label)+'</span></button>';
  });
  return html;
}
function buildTabbarHtml(){
  // aria-label blijft altijd aanwezig: bij 2x lettergrootte op een smalle gsm in portret wordt het
  // zichtbare tekstlabel onder het icoontje verborgen (te weinig breedte), maar voor schermlezers
  // blijft de naam van het onderdeel zo gewoon hoorbaar.
  var html = NAV_SECTIONS.filter(function(s){ return s.href==="#/" || s.tab; }).map(function(s){
    var label = s.tabLabel||s.label;
    return '<button type="button" class="tabbar-link" data-action="nav" data-href="'+s.href+'" data-match="'+s.match+'" aria-label="'+esc(label)+'">'+s.icon+'<span>'+esc(label)+'</span></button>';
  }).join("");
  html += '<button type="button" class="tabbar-link" data-action="nav" data-href="#/meer" data-match="/meer" aria-label="Meer">'+ICONS.dots+'<span>Meer</span></button>';
  return html;
}
function updateChromeActive(path){
  document.querySelectorAll('.sidebar-link[data-match], .tabbar-link[data-match]').forEach(function(el){
    el.classList.toggle("active", navItemActive(path, el.getAttribute("data-match")));
  });
}
function screenMeer(){
  var items = NAV_SECTIONS.filter(function(s){ return !s.divider && !s.tab && s.href!=="#/"; });
  var cards = items.map(function(s){ return navCard(s.href, s.icon, s.label.replace(" & more",""), ""); }).join("");
  return Promise.resolve(
    topbar("Meer", "#/", "") +
    '<div class="container container-wide"><div class="nav-grid">'+cards+'</div></div>'
  );
}
function field(label, id, inputHtml, required){
  return '<div class="field"><label'+(id?(' for="'+id+'"'):'')+'>'+esc(label)+(required?' <span class="req">*</span>':'')+'</label>'+inputHtml+'</div>';
}
function selectHtml(name, options, selected, placeholder){
  var out = '<select id="'+name+'" name="'+name+'">';
  out += '<option value=""'+(!selected?' selected':'')+'>'+esc(placeholder)+'</option>';
  options.forEach(function(o){
    var val = String(o);
    var label = /^[a-zà-ÿ]/.test(val) ? capFirst(val) : val;
    var sel = (String(selected)===val) ? ' selected' : '';
    out += '<option value="'+esc(val)+'"'+sel+'>'+esc(label)+'</option>';
  });
  out += '</select>';
  return out;
}
function countriesDatalist(){

function contactFullName(c){
  return [c.voornaam, c.achternaam].filter(Boolean).join(" ");

function isZelfContact(c){
  // "Erick van der Bos" (in al zijn vormen) is de gebruiker zelf en hoort niet thuis
  // in een overzicht van "met wie" iets gedaan is.
  var naam = String(contactFullName(c)||"").trim().toLowerCase();
  var short = String(c.shortName||"").trim().toLowerCase();
  return naam==="erick van der bos" || short==="erick" || short==="erick van der bos";
}

// Direct-opslaande sterrenwidget (geen formulier nodig): tikken zet meteen de beoordeling
// van record `id` in `store` op die waarde; nogmaals tikken op dezelfde ster wist de beoordeling.
function starsInlineEditable(current, store, field2, id, extraClass){
  current = Number(current)||0;
  var btns = "";
  for(var i=1;i<=5;i++){
    var label = i+" van 5 sterren"+(i===current?" (tik nogmaals om te wissen)":"");
    btns += '<button type="button" class="star-btn'+(i<=current?' filled':'')+'" data-action="rate-inline" data-store="'+store+'" data-field="'+field2+'" data-id="'+id+'" data-val="'+i+'" aria-label="'+esc(label)+'">'+(i<=current?ICONS.starFull:ICONS.starEmpty)+'</button>';
  }
  return '<span class="stars'+(extraClass?(' '+extraClass):'')+'">'+btns+'</span>';
}
function typeChip(naam, id, deleteAction){

// "Met wie"-veld met een knopje om 1 of meerdere contactpersonen te kiezen uit de Contacts-tabel

// de gekozen namen worden alfabetisch, komma-gescheiden in het tekstveld gezet.
function metWieField(label, id, value){
  return '<div class="field"><label for="'+id+'">'+esc(label)+'</label>'+
    '<div style="display:flex; gap:8px;">'+
      '<input type="text" id="'+id+'" name="metWie" value="'+esc(value||"")+'" style="flex:1;">'+
      '<button type="button" class="btn btn-ghost btn-sm" data-action="pick-contacts" data-target="'+id+'" title="Kies contactpersonen" aria-label="Kies contactpersonen">👤</button>'+
    '</div></div>';
}
// Valideert dat een ingevuld GSM-nummer met een internationaal landcode-plusteken begint
// (bijv. "+32 497576018"), zodat het nummer altijd herkenbaar/bruikbaar is ongeacht vanuit welk land je het intikt.
function isValidIntlGsm(s){
  return /^\+[0-9][0-9 ]*$/.test(String(s||"").trim());
}

function jaarSortKey(j){ return (typeof j==="number") ? j : -1; }
function screenTripsList(qs){
  return dbGetAll("trips").then(function(trips){
    trips.sort(function(a,b){
      return jaarSortKey(b.jaar)-jaarSortKey(a.jaar) || countryLabel(a.landCode,a.landNaam).localeCompare(countryLabel(b.landCode,b.landNaam));
    });
    var filterCode = qs.land || "";
    if(filterCode) trips = trips.filter(function(t){ return t.landCode===filterCode; });
    var filterCheck = qs.validatie === "To check";
    if(filterCheck) trips = trips.filter(function(t){ return t.validatie==="To check"; });
    var listHtml;
    if(trips.length===0){
      listHtml = '<div class="empty-state">'+ICONS.empty+'<p>'+((filterCode||filterCheck)?"Geen reizen gevonden voor dit filter.":"Nog geen reizen toegevoegd.")+'</p></div>';
    } else {
      listHtml = trips.map(function(t){
        var naam = countryLabel(t.landCode, t.landNaam);
        var jaarLabel = (t.jaar!==undefined && t.jaar!==null && t.jaar!=="") ? t.jaar : "";
        var sub = [t.plaatsen, t.metWie].filter(Boolean).join(" · ");
        var searchText = [naam, t.plaatsen, t.groep, t.metWie, t.opmerkingen, t.jaar, t.organisatie].filter(Boolean).join(" ").toLowerCase();
        var checkBadge = t.validatie==="To check" ? '<span class="badge badge-secondary">To check</span>' : '';
        return '<div class="list-row trip-row" data-action="nav" data-href="#/reizen/'+t.id+'" data-search="'+esc(searchText)+'" role="button" tabindex="0">'+
          '<span class="flag">'+flagEmoji(t.landCode)+'</span>'+
          '<span class="trip-row-main">'+
            '<span class="trip-row-top"><b>'+esc(naam)+'</b><span class="trip-row-jaar">'+esc(jaarLabel)+'</span></span>'+
            (sub?'<span class="trip-row-sub">'+esc(sub)+'</span>':'')+
            '<span class="trip-row-stars">'+starsInlineEditable(t.beoordeling||0, "trips", "beoordeling", t.id, "stars-sm")+checkBadge+'</span>'+
          '</span>'+
          '<span class="chev">'+ICONS.chevron+'</span>'+
        '</div>';
      }).join("");
    }
    var filterBadges = "";
    if(filterCode) filterBadges += '<span class="badge badge-accent">Filter: '+esc(countryLabel(filterCode))+'</span><button class="btn btn-ghost btn-sm" data-action="nav" data-href="'+("#/reizen"+qsToQueryString({validatie:qs.validatie}))+'">Wis filter</button>';
    if(filterCheck) filterBadges += '<span class="badge badge-secondary">Validatie: To check</span><button class="btn btn-ghost btn-sm" data-action="nav" data-href="'+("#/reizen"+qsToQueryString({land:qs.land}))+'">Wis filter</button>';
    var filterBar = filterBadges ? '<div class="filter-bar">'+filterBadges+'</div>' : "";
    var searchBox = trips.length===0 ? "" : '<div class="search-field">'+ICONS.search+'<input type="search" placeholder="Zoek op land, plaats, opmerkingen…" data-action="search-list" aria-label="Zoeken in reizen"></div>';
    return topbar("Alle Reizen", "#/", validatieFilterBtn("#/reizen", qs)+'<button class="icon-btn icon-btn-add" data-action="nav" data-href="#/reizen/nieuw" aria-label="Nieuwe reis toevoegen">'+ICONS.plus+'</button>')+
      '<div class="container container-wide">'+filterBar+searchBox+'<div id="searchResults">'+listHtml+'</div><p class="empty-state" id="noSearchResults" style="display:none;">Geen reizen gevonden voor deze zoekopdracht.</p></div>';
  });
}

var DUUR_ABBREV = { "Een maand of meer":"Maand+", "Een week of meer":"Week+", "Kort bezoek":"Kort bezoek", "Onbekend":"Onbekend" };
function screenYears(qs){
  return Promise.all([dbGetAll("trips"), dbGetAll("keymoments"), dbGetAll("concerts")]).then(function(res){
    var trips=res[0], kms=res[1], concerts=res[2];
    var byYear = {};
    function bucket(y){ if(!byYear[y]) byYear[y]={trips:[],kms:[],concerts:[]}; return byYear[y]; }
    trips.forEach(function(t){
      if(t.jaar===undefined || t.jaar===null || t.jaar==="") return;
      bucket(t.jaar).trips.push(t);
    });
    kms.forEach(function(k){
      if(k.jaar===undefined || k.jaar===null || k.jaar==="") return;
      bucket(k.jaar).kms.push(k);
    });
    concerts.forEach(function(c){
      if(c.jaar===undefined || c.jaar===null || c.jaar==="") return;
      bucket(c.jaar).concerts.push(c);
    });
    var yearKeys = Object.keys(byYear);
    var numericYears = yearKeys.filter(function(k){ return k!=="Onbekend"; }).map(Number).sort(function(a,b){return b-a;});
    var orderedKeys = numericYears.slice();
    if(byYear.hasOwnProperty("Onbekend")) orderedKeys.push("Onbekend");
    var openYear = qs.open ? qs.open : null;
    var body;
    if(orderedKeys.length===0){
      body = '<div class="empty-state">'+ICONS.empty+'<p>Nog geen reizen of key moments om te tonen.</p></div>';
    } else {
      body = orderedKeys.map(function(y){
        var yTrips = byYear[y].trips, yKms = byYear[y].kms, yConcerts = byYear[y].concerts;
        var isOpen = openYear!==null && String(openYear)===String(y);
        var toggleHref = "#/jaaroverzicht"+qsToQueryString(isOpen ? {} : {open:String(y)});
        var rowHtml = '<div class="list-row wmw-row'+(isOpen?' expanded':'')+'" data-action="nav" data-href="'+toggleHref+'" role="button" tabindex="0" aria-expanded="'+(isOpen?"true":"false")+'">'+
          '<span class="person-marker-badge">'+ICONS.calendar+'</span>'+
          '<span class="info"><b>'+esc(y)+'</b>'+miniStatsHtml(yTrips.length, yKms.length, yConcerts.length)+'</span>'+
          '<span class="chev">'+ICONS.chevron+'</span>'+
        '</div>';
        var detailHtml = "";
        if(isOpen){
          var yTripsSorted = yTrips.slice().sort(function(a,b){
            return countryLabel(a.landCode,a.landNaam).localeCompare(countryLabel(b.landCode,b.landNaam));
          });
          var yKmsSorted = yKms.slice().sort(function(a,b){ return String(a.type).localeCompare(String(b.type)); });
          var yConcertsSorted = yConcerts.slice().sort(function(a,b){ return String(a.type).localeCompare(String(b.type)) || String(a.artiestNaam||"").localeCompare(String(b.artiestNaam||"")); });
          var tripChips = yTripsSorted.map(function(t){
            var naam = countryLabel(t.landCode, t.landNaam);
            return '<button class="year-trip-chip" data-action="nav" data-href="#/reizen/'+t.id+'">'+
              '<span class="flag">'+flagEmoji(t.landCode)+'</span>'+
              '<span class="land">'+esc(naam)+'</span>'+
              '<span class="duur-badge">'+esc(DUUR_ABBREV[t.duur]||t.duur||"")+'</span>'+
            '</button>';
          }).join("");
          var kmChips = yKmsSorted.map(function(k){
            var landPart = k.landCode||k.landNaam ? (" — "+countryLabel(k.landCode,k.landNaam)) : "";
            return '<button class="year-trip-chip year-km-chip" data-action="nav" data-href="#/keymoments/'+k.id+'">'+
              '<span class="ic-emoji">'+(KEYMOMENT_ICONS[k.type]||"⭐")+'</span>'+
              '<span class="land">'+esc(k.omschrijving||k.type)+esc(landPart)+'</span>'+
            '</button>';
          }).join("");
          // Div i.p.v. button: er zit een aanklikbare sterrenwidget in genest, en een <button> mag
          // geen <button> als kind bevatten (dat breekt de HTML). Klik-navigatie werkt via data-action="nav" ook op divs.
          var concertChips = yConcertsSorted.map(function(c){
            return '<div class="year-trip-chip year-concert-chip" data-action="nav" data-href="#/concerts/'+c.id+'" role="button" tabindex="0">'+
              '<span class="ic-emoji">'+(CONCERT_ICONS[c.type]||"🎤")+'</span>'+
              '<span class="land">'+esc(c.artiestNaam||c.type)+'</span>'+
              starsInlineEditable(c.beoordeling||0, "concerts", "beoordeling", c.id, "stars-sm")+
            '</div>';
          }).join("");
          detailHtml = '<div class="wmw-detail"><div class="year-trips">'+tripChips+kmChips+concertChips+'</div></div>';
        }
        return rowHtml + detailHtml;
      }).join("");
    }
    return topbar("Overzicht per jaar", "#/", "")+'<div class="container container-wide">'+body+'</div>';
  });
}
/* ============================== SCHERMEN: REIS IDEETJES ============================== */
function screenIdeasList(){
  return Promise.all([dbGetAll("ideas"), getIdeaTypes()]).then(function(res){
    var ideas=res[0], allTypes=res[1];
    var searchBox = ideas.length===0 ? "" : '<div class="search-field">'+ICONS.search+'<input type="search" placeholder="Zoek op land, plaats, omschrijving…" data-action="search-list" aria-label="Zoeken in reis ideetjes"></div>';
    if(ideas.length===0){
      return topbar("Reis ideetjes", "#/", '<button class="icon-btn icon-btn-add" data-action="nav" data-href="#/ideetjes/nieuw" aria-label="Nieuw ideetje">'+ICONS.plus+'</button>')+
        '<div class="container container-wide"><div class="empty-state">'+ICONS.empty+'<p>Nog geen reis ideetjes bewaard.</p></div></div>';
    }
    var groups = {};
    var groupOrder = allTypes.slice();
    ideas.forEach(function(i){
      var key = i.type && groupOrder.indexOf(i.type)!==-1 ? i.type : "__geen__";
      if(!groups[key]) groups[key] = [];
      groups[key].push(i);
    });
    var orderedGroupKeys = groupOrder.filter(function(t){ return groups[t]; });
    if(groups.__geen__) orderedGroupKeys.push("__geen__");
    function rowHtml(i){
      var naam = countryLabel(i.landCode, i.landNaam);
      var sub = [i.plaats, i.metWie].filter(Boolean).join(" · ");
      var doneBadge = i.gedaan==="Ja" ? '<span class="badge badge-secondary">Gedaan</span>' : '';
      var searchText = [naam, i.plaats, i.omschrijving, i.tipVan, i.opmerkingen, i.type, i.metWie].filter(Boolean).join(" ").toLowerCase();
      return '<button class="list-row" data-action="nav" data-href="#/ideetjes/'+i.id+'" data-search="'+esc(searchText)+'">'+
        '<span class="flag">'+flagEmoji(i.landCode)+'</span>'+
        '<span class="info"><b>'+esc(naam)+'</b><small>'+esc(sub)+'</small></span>'+
        doneBadge+
        '<span class="chev">'+ICONS.chevron+'</span>'+
      '</button>';
    }
    var sectionsHtml = orderedGroupKeys.map(function(key){
      var label = key==="__geen__" ? "Geen type" : capFirst(key);
      var list = groups[key].slice().sort(function(a,b){ return countryLabel(a.landCode,a.landNaam).localeCompare(countryLabel(b.landCode,b.landNaam)); });
      return '<div class="group-section"><div class="group-header"><h3>'+esc(label)+'</h3><span class="group-count">'+list.length+' '+(list.length===1?"idee":"ideeën")+'</span></div>'+
        list.map(rowHtml).join("")+
      '</div>';
    }).join("");
    return topbar("Reis ideetjes", "#/", '<button class="icon-btn icon-btn-add" data-action="nav" data-href="#/ideetjes/nieuw" aria-label="Nieuw ideetje">'+ICONS.plus+'</button>')+
      '<div class="container container-wide">'+searchBox+'<div id="searchResults">'+sectionsHtml+'</div><p class="empty-state" id="noSearchResults" style="display:none;">Geen ideetjes gevonden voor deze zoekopdracht.</p></div>';
  });
}

function concertYearSortAsc(a,b){
  var ao = a.jaar==="Onbekend", bo = b.jaar==="Onbekend";
  if(ao && bo) return 0;
  if(ao) return 1;
  if(bo) return -1;
  return (a.jaar||0)-(b.jaar||0);
}
function screenConcertsList(qs){
  return Promise.all([dbGetAll("concerts"), getConcertTypes()]).then(function(res){
    var concerts=res[0], allTypes=res[1];
    var filterCheck = qs.validatie === "To check";
    if(filterCheck) concerts = concerts.filter(function(c){ return c.validatie==="To check"; });
    var filterBar = filterCheck ? '<div class="filter-bar"><span class="badge badge-secondary">Validatie: To check</span><button class="btn btn-ghost btn-sm" data-action="nav" data-href="#/concerts">Wis filter</button></div>' : "";
    var searchBox = concerts.length===0 ? "" : '<div class="search-field">'+ICONS.search+'<input type="search" placeholder="Zoek op artiest, locatie, jaar…" data-action="search-list" aria-label="Zoeken in Concerts &amp; more"></div>';
    if(concerts.length===0){
      return topbar("Concerts & more", "#/", validatieFilterBtn("#/concerts", qs)+'<button class="icon-btn icon-btn-add" data-action="nav" data-href="#/concerts/nieuw" aria-label="Nieuw item">'+ICONS.plus+'</button>')+
        '<div class="container container-wide">'+filterBar+'<div class="empty-state">'+ICONS.empty+'<p>'+(filterCheck?"Geen items gevonden voor dit filter.":"Nog geen concerten, theater, films of andere leuke herinneringen toegevoegd.")+'</p></div></div>';
    }
    var groups = {};
    var groupOrder = allTypes.slice();
    concerts.forEach(function(c){
      var key = c.type && groupOrder.indexOf(c.type)!==-1 ? c.type : "__geen__";
      if(!groups[key]) groups[key] = [];
      groups[key].push(c);
    });
    var orderedGroupKeys = groupOrder.filter(function(t){ return groups[t]; });
    if(groups.__geen__) orderedGroupKeys.push("__geen__");
    function rowHtml(c){
      var label = c.artiestNaam || c.type || "";
      var sub = [ (c.jaar!==undefined&&c.jaar!==null&&c.jaar!=="")?c.jaar:"", c.locatie].filter(Boolean).join(" · ");
      var searchText = [c.jaar, c.type, c.artiestNaam, c.locatie, c.metWie, c.details].filter(Boolean).join(" ").toLowerCase();
      var checkBadge = c.validatie==="To check" ? '<span class="badge badge-secondary">To check</span>' : '';
      return '<div class="list-row concert-row" data-action="nav" data-href="#/concerts/'+c.id+'" data-search="'+esc(searchText)+'" role="button" tabindex="0">'+
        '<span class="ic-emoji">'+(CONCERT_ICONS[c.type]||"🎤")+'</span>'+
        '<span class="trip-row-main">'+
          '<span class="trip-row-top"><b>'+esc(label)+'</b></span>'+
          (sub?'<span class="trip-row-sub">'+esc(sub)+'</span>':'')+
          '<span class="trip-row-stars concert-row-stars">'+starsInlineEditable(c.beoordeling||0, "concerts", "beoordeling", c.id, "stars-sm")+checkBadge+'</span>'+
        '</span>'+
        '<span class="chev">'+ICONS.chevron+'</span>'+
      '</div>';
    }
    var sectionsHtml = orderedGroupKeys.map(function(key){
      var label = key==="__geen__" ? "Geen type" : capFirst(key);
      var list = groups[key].slice().sort(concertYearSortAsc);
      return '<div class="group-section"><div class="group-header"><h3>'+esc(label)+'</h3><span class="group-count">'+list.length+' '+(list.length===1?"item":"items")+'</span></div>'+
        list.map(rowHtml).join("")+
      '</div>';
    }).join("");
    return topbar("Concerts & more", "#/", validatieFilterBtn("#/concerts", qs)+'<button class="icon-btn icon-btn-add" data-action="nav" data-href="#/concerts/nieuw" aria-label="Nieuw item">'+ICONS.plus+'</button>')+
      '<div class="container container-wide">'+filterBar+searchBox+'<div id="searchResults">'+sectionsHtml+'</div><p class="empty-state" id="noSearchResults" style="display:none;">Niets gevonden voor deze zoekopdracht.</p></div>';
  });
}

function metWieNames(s){
  return String(s||"").split(",").map(function(x){ return x.trim(); }).filter(Boolean);
}
function itemDateKey(kind, item){
  if(kind==="trip" && item.vanDatum) return item.vanDatum;
  if(kind!=="trip" && item.datum) return item.datum;
  if(item.jaar!==undefined && item.jaar!==null && item.jaar!=="" && item.jaar!=="Onbekend"){
    var mm = (kind==="trip" && item.maand && item.maand!=="Onbekend") ? (item.maand.length<2?"0"+item.maand:item.maand) : "01";
    return item.jaar+"-"+mm+"-01";
  }
  return "0000-00-00";
}
function watMetWieChip(kind, item){
  if(kind==="trip"){
    var naam = countryLabel(item.landCode, item.landNaam);
    var jaarLabel = (item.jaar!==undefined && item.jaar!==null && item.jaar!=="") ? item.jaar : "";
    return '<button class="year-trip-chip" data-action="nav" data-href="#/reizen/'+item.id+'">'+
      '<span class="flag">'+flagEmoji(item.landCode)+'</span>'+
      '<span class="land">'+esc(naam)+'</span>'+
      '<span class="duur-badge">'+esc(jaarLabel)+'</span>'+
    '</button>';
  }
  if(kind==="km"){
    var landPart = (item.landCode||item.landNaam) ? (" — "+countryLabel(item.landCode,item.landNaam)) : "";
    var jaarLabel2 = (item.jaar!==undefined && item.jaar!==null && item.jaar!=="") ? item.jaar : "";
    return '<button class="year-trip-chip year-km-chip" data-action="nav" data-href="#/keymoments/'+item.id+'">'+
      '<span class="ic-emoji">'+(KEYMOMENT_ICONS[item.type]||"⭐")+'</span>'+
      '<span class="land">'+esc(item.omschrijving||item.type)+esc(landPart)+'</span>'+
      '<span class="duur-badge">'+esc(jaarLabel2)+'</span>'+
    '</button>';
  }
  var jaarLabel3 = (item.jaar!==undefined && item.jaar!==null && item.jaar!=="") ? item.jaar : "";
  return '<button class="year-trip-chip year-concert-chip" data-action="nav" data-href="#/concerts/'+item.id+'">'+
    '<span class="ic-emoji">'+(CONCERT_ICONS[item.type]||"🎤")+'</span>'+
    '<span class="land">'+esc(item.artiestNaam||item.type)+'</span>'+
    '<span class="duur-badge">'+esc(jaarLabel3)+'</span>'+
  '</button>';
}
function simpleNameHash(s){
  var h = 0, str = String(s||"");
  for(var i=0;i<str.length;i++){ h = ((h<<5)-h+str.charCodeAt(i))|0; }
  return Math.abs(h);
}
// Elk diertje krijgt een eigen, vrolijke kleurencombinatie (los van de categorie-kleuren elders in
// de app) zodat de icoontjes bij "Wat met wie" echt opvallen en van elkaar te onderscheiden zijn.
var ANIMAL_STYLES = {
  elephant: { icon:"animalElephant", bg:"--contact-accent-soft", fg:"--contact-accent" },
  turtle: { icon:"animalTurtle", bg:"--todo-accent-soft", fg:"--todo-accent" },
  lion: { icon:"animalLion", bg:"--lion-accent-soft", fg:"--lion-accent" },
  bear: { icon:"animalBear", bg:"--brown-soft", fg:"--brown" },
  rabbit: { icon:"animalRabbit", bg:"--concert-accent-soft", fg:"--concert-accent" },
  koala: { icon:"animalKoala", bg:"--koala-accent-soft", fg:"--koala-accent" },
  fox: { icon:"animalFox", bg:"--secondary-soft", fg:"--secondary" },
  cat: { icon:"animalCat", bg:"--km-accent-soft", fg:"--km-accent" },
  tiger: { icon:"animalTiger", bg:"--tiger-accent-soft", fg:"--tiger-accent" },
  owl: { icon:"animalOwl", bg:"--wmw-accent-soft", fg:"--wmw-accent" }
};
function animalKeyForCounts(tripCount, kmCount, concertCount, seed){
  // Binnen elke categorie (reizen/key moments/concerten) kiezen we op basis van een hash van de
  // naam tussen 3 vrolijke -en nu ook wildere- diertjes, zodat niet iedereen met dezelfde
  // "hoofdactiviteit" ook precies hetzelfde icoontje krijgt.
  var variant = simpleNameHash(seed) % 3;
  if(concertCount>tripCount && concertCount>kmCount) return ["fox","cat","tiger"][variant];
  if(tripCount>kmCount && tripCount>concertCount) return ["elephant","turtle","lion"][variant];
  if(kmCount>tripCount && kmCount>concertCount) return ["bear","rabbit","koala"][variant];
  return "owl";
}
function animalBadgeHtml(tripCount, kmCount, concertCount, seed){
  var style = ANIMAL_STYLES[animalKeyForCounts(tripCount, kmCount, concertCount, seed)];
  return '<span class="person-marker-badge" style="background:var('+style.bg+');color:var('+style.fg+')">'+ICONS[style.icon]+'</span>';
}
function miniStatsHtml(tripCount, kmCount, concertCount){
  return '<span class="wmw-minis">'+
    '<span class="wmw-mini mini-trips" title="Reizen">'+ICONS.suitcase+'<b>'+tripCount+'</b></span>'+
    '<span class="wmw-mini mini-km" title="Key moments">'+ICONS.star2+'<b>'+kmCount+'</b></span>'+
    '<span class="wmw-mini mini-concerts" title="Concerts &amp; more">'+ICONS.mic+'<b>'+concertCount+'</b></span>'+
  '</span>';
}
function watMetWieCounts(c, trips, kms, concerts){
  var tripCount = trips.filter(function(t){ return metWieNames(t.metWie).indexOf(c.shortName)!==-1; }).length;
  var kmCount = kms.filter(function(k){ return metWieNames(k.metWie).indexOf(c.shortName)!==-1; }).length;
  var concertCount = concerts.filter(function(x){ return metWieNames(x.metWie).indexOf(c.shortName)!==-1; }).length;
  return { tripCount:tripCount, kmCount:kmCount, concertCount:concertCount, total: tripCount+kmCount+concertCount };
}
function watMetWieDetailHtml(c, trips, kms, concerts){
  var myTrips = trips.filter(function(t){ return metWieNames(t.metWie).indexOf(c.shortName)!==-1; });
  var myKms = kms.filter(function(k){ return metWieNames(k.metWie).indexOf(c.shortName)!==-1; });
  var myConcerts = concerts.filter(function(x){ return metWieNames(x.metWie).indexOf(c.shortName)!==-1; });
  var items = [].concat(
    myTrips.map(function(t){ return {kind:"trip", item:t, key:itemDateKey("trip",t)}; }),
    myKms.map(function(k){ return {kind:"km", item:k, key:itemDateKey("km",k)}; }),
    myConcerts.map(function(x){ return {kind:"concert", item:x, key:itemDateKey("concert",x)}; })
  );
  items.sort(function(a,b){ return b.key<a.key ? -1 : (b.key>a.key ? 1 : 0); });
  var listHtml = items.length===0
    ? '<div class="empty-state">'+ICONS.empty+'<p>Nog niets gedeeld.</p></div>'
    : '<div class="year-trips">'+items.map(function(x){ return watMetWieChip(x.kind, x.item); }).join("")+'</div>';
  return '<div class="wmw-detail">'+
      '<div class="wmw-stats">'+
        '<div class="wmw-stat"><b>'+myTrips.length+'</b><span>Reizen</span></div>'+
        '<div class="wmw-stat"><b>'+myKms.length+'</b><span>Key moments</span></div>'+
        '<div class="wmw-stat"><b>'+myConcerts.length+'</b><span>Concerts &amp; more</span></div>'+
      '</div>'+
      listHtml+
    '</div>';
}
function screenWatMetWie(qs){
  return Promise.all([dbGetAll("contacts"), dbGetAll("trips"), dbGetAll("keymoments"), dbGetAll("concerts")]).then(function(res){
    var contacts=res[0].filter(function(c){ return !isZelfContact(c); }), trips=res[1], kms=res[2], concerts=res[3];
    var openId = qs.open ? Number(qs.open) : null;
    var summaries = contacts.map(function(c){
      var counts = watMetWieCounts(c, trips, kms, concerts);
      return { contact:c, tripCount:counts.tripCount, kmCount:counts.kmCount, concertCount:counts.concertCount, total:counts.total };
    }).filter(function(s){ return s.total>0; });
    summaries.sort(function(a,b){ return b.total-a.total || String(a.contact.shortName||"").localeCompare(String(b.contact.shortName||"")); });
    var body;
    if(summaries.length===0){
      body = '<div class="empty-state">'+ICONS.empty+'<p>Nog geen reizen, key moments of concerten gekoppeld aan een contact via "Met wie".</p></div>';
    } else {
      body = summaries.map(function(s){
        var naam = contactFullName(s.contact) || s.contact.shortName;
        var isOpen = openId===s.contact.id;
        var toggleHref = "#/watmetwie"+qsToQueryString(isOpen ? {} : {open:String(s.contact.id)});
        var rowHtml = '<div class="list-row wmw-row'+(isOpen?' expanded':'')+'" data-action="nav" data-href="'+toggleHref+'" role="button" tabindex="0" aria-expanded="'+(isOpen?"true":"false")+'">'+
          animalBadgeHtml(s.tripCount, s.kmCount, s.concertCount, s.contact.shortName)+
          '<span class="info"><b>'+esc(naam)+'</b>'+miniStatsHtml(s.tripCount, s.kmCount, s.concertCount)+'</span>'+
          '<span class="chev">'+ICONS.chevron+'</span>'+
        '</div>';
        return rowHtml + (isOpen ? watMetWieDetailHtml(s.contact, trips, kms, concerts) : "");
      }).join("");
    }
    return topbar("Wat met wie", "#/", "")+'<div class="container container-wide">'+body+'</div>';
  });
}
