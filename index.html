function render(preserveScroll){
  var root = document.getElementById("root");
  var scrollBefore = preserveScroll ? window.scrollY : 0;
  var path = pathFromHash();
  var qs = qsFromHash();
  var m;
  var p;
  try{
    if(path==="" || path==="/"){ p = screenDashboard(); }
    else if(path==="/reizen"){ p = screenTripsList(qs); }
    else if(path==="/reizen/nieuw"){ p = screenTripForm(null); }
    else if((m=path.match(/^\/reizen\/(\d+)\/bewerken$/))){ p = screenTripForm(Number(m[1])); }
    else if((m=path.match(/^\/reizen\/(\d+)$/))){ p = screenTripDetail(Number(m[1])); }
    else if(path==="/jaaroverzicht"){ p = screenYears(qs); }
    else if(path==="/ideetjes"){ p = screenIdeasList(); }
    else if(path==="/ideetjes/nieuw"){ p = screenIdeaForm(null); }
    else if((m=path.match(/^\/ideetjes\/(\d+)\/bewerken$/))){ p = screenIdeaForm(Number(m[1])); }
    else if((m=path.match(/^\/ideetjes\/(\d+)$/))){ p = screenIdeaDetail(Number(m[1])); }
    else if(path==="/keymoments"){ p = screenKeyMomentsList(qs); }
    else if(path==="/keymoments/nieuw"){ p = screenKeyMomentForm(null); }
    else if((m=path.match(/^\/keymoments\/(\d+)\/bewerken$/))){ p = screenKeyMomentForm(Number(m[1])); }
    else if((m=path.match(/^\/keymoments\/(\d+)$/))){ p = screenKeyMomentDetail(Number(m[1])); }
    else if(path==="/todos"){ p = screenTodosList(); }
    else if(path==="/todos/nieuw"){ p = screenTodoForm(null); }
    else if((m=path.match(/^\/todos\/(\d+)\/bewerken$/))){ p = screenTodoForm(Number(m[1])); }
    else if((m=path.match(/^\/todos\/(\d+)$/))){ p = screenTodoDetail(Number(m[1])); }
    else if(path==="/concerts"){ p = screenConcertsList(qs); }
    else if(path==="/concerts/nieuw"){ p = screenConcertForm(null); }
    else if((m=path.match(/^\/concerts\/(\d+)\/bewerken$/))){ p = screenConcertForm(Number(m[1])); }
    else if((m=path.match(/^\/concerts\/(\d+)$/))){ p = screenConcertDetail(Number(m[1])); }
    else if(path==="/contacts"){ p = screenContactsList(); }
    else if(path==="/contacts/nieuw"){ p = screenContactForm(null); }
    else if((m=path.match(/^\/contacts\/(\d+)\/bewerken$/))){ p = screenContactForm(Number(m[1])); }
    else if((m=path.match(/^\/contacts\/(\d+)$/))){ p = screenContactDetail(Number(m[1])); }
    else if(path==="/watmetwie"){ p = screenWatMetWie(qs); }
    else if(path==="/administratie"){ p = screenAdmin(); }
    else if(path==="/administratie/opties"){ p = screenAdminOptions(); }
    else if(path==="/meer"){ p = screenMeer(); }
    else { navigate("#/"); return; }
  }catch(err){
    p = Promise.reject(err);
  }
  // Het gele achtergrondmotiefje uitschakelen op detailschermen: daar staat de tekst dicht
  // opeen en leest het motiefje te druk mee. Op lijst-/dashboardschermen blijft het aan.
  var isDetailScreen = /^\/(reizen|ideetjes|keymoments|todos|concerts|contacts)\/\d+$/.test(path);
  document.body.classList.toggle("no-pattern", isDetailScreen);
  p.then(function(html){
    root.innerHTML = html;
    if(preserveScroll){ window.scrollTo(0, scrollBefore); } else { window.scrollTo(0,0); }
    if(path==="" || path==="/"){ initMapZoom(); }
    updateChromeActive(path);
  }).catch(function(err){
    console.error(err);
    root.innerHTML = topbar("My travels and Adventures", "#/", "") + '<div class="container"><div class="empty-state"><p>Er ging iets mis: '+esc((err&&err.message)||String(err))+'</p></div></div>';
  });
}

document.addEventListener("click", function(e){

  if(authLogoutBtn){
    e.preventDefault();

    return;

  // onder je vinger eindigde.
  if(mapZoomMoved && e.target.closest("#mapWrap")){
    mapZoomMoved = false;

    e.stopPropagation();
    return;
  }
  var zoomBtn = e.target.closest('[data-action="map-zoom-in"],[data-action="map-zoom-out"],[data-action="map-zoom-reset"]');
  if(zoomBtn){
    e.preventDefault();

      var zoomAction = zoomBtn.getAttribute("data-action");
      if(zoomAction==="map-zoom-reset"){ mapZoom.scale=1; mapZoom.x=0; mapZoom.y=0; applyMapZoom(); }
      else{
        var centerPt = mapWrapCenter(zoomWrap);
        mapZoomAt(centerPt[0], centerPt[1], zoomAction==="map-zoom-in" ? 1.4 : 1/1.4);
      }
    }
    return;
  }
  // Sterren-tik (in lijst of op detailpagina) vangen we vóór de nav-check af, want de
  // sterknop kan binnen een klikbare rij/kaart zitten die zelf ook data-action="nav" heeft.
  var rateBtn = e.target.closest('[data-action="rate-inline"]');
  if(rateBtn){
    e.preventDefault();
    var rStore = rateBtn.getAttribute("data-store");
    var rField = rateBtn.getAttribute("data-field");
    var rId = Number(rateBtn.getAttribute("data-id"));
    var rVal = Number(rateBtn.getAttribute("data-val"));
    dbGet(rStore, rId).then(function(rec){
      if(!rec) return;
      rec[rField] = (rec[rField]===rVal) ? null : rVal;
      Object.assign(rec, stampForEdit(rec));
      return dbPut(rStore, rec);
    }).then(function(){ render(true); });
    return;
  }

  var navBtn = e.target.closest('[data-action="nav"]');
  if(navBtn){ e.preventDefault(); navigate(navBtn.getAttribute("data-href")); return; }

  if(e.target.closest('[data-action="modal-cancel"]')){ closeModal(); return; }

  var mapDot = e.target.closest(".map-dot-visited");
  if(mapDot){ navigate("#/reizen?land="+mapDot.getAttribute("data-code")); return; }

  var delBtn = e.target.closest('[data-action^="delete-"]');
  if(delBtn){
    var action = delBtn.getAttribute("data-action");
    var kindMatch = action.match(/^delete-(trip|idea|keymoment|todo|concert|contact)$/);
    if(kindMatch){
      var info = DELETE_ROUTES[kindMatch[1]];
      var rid = Number(delBtn.getAttribute("data-id"));
      confirmDialog(info.label+" verwijderen", "Weet je zeker dat je dit wilt verwijderen? Dit kan niet ongedaan worden gemaakt.", "Verwijderen", function(){
        dbDelete(info.store, rid).then(function(){ toast(info.label+" verwijderd."); navigate(info.listHash); });
      }, true);
      return;
    }
    var allMatch = action.match(/^delete-all-(trips|ideas|keymoments|todos|concerts|contacts)$/);
    if(allMatch){
      var storeName = allMatch[1];
      var labels = {trips:"reizen", ideas:"reis ideetjes", keymoments:"key moments", todos:"bucket-list items", concerts:"Concerts & more items", contacts:"contacten"};
      confirmDialog("Alle "+labels[storeName]+" verwijderen", "Weet je het zeker? Alles wordt definitief verwijderd. Dit kan niet ongedaan worden gemaakt.", "Ja, alles verwijderen", function(){
        dbClear(storeName).then(function(){ toast("Alle "+labels[storeName]+" zijn verwijderd."); render(); });
      }, true);
      return;
    }
    var optMatch = action==="delete-option";
    if(optMatch){
      var oStore = delBtn.getAttribute("data-store");
      var oId = Number(delBtn.getAttribute("data-id"));
      dbDelete(oStore, oId).then(function(){ toast("Optie verwijderd."); render(); });
      return;
    }
  }

  var starBtn = e.target.closest('[data-action="star-set"]');
  if(starBtn){
    var val = Number(starBtn.getAttribute("data-val"));
    var widget = document.getElementById("starsWidget");
    if(widget) widget.outerHTML = starsWidget(val);
    return;
  }
  var starClear = e.target.closest('[data-action="star-clear"]');
  if(starClear){
    var w2 = document.getElementById("starsWidget");
    if(w2) w2.outerHTML = starsWidget(0);
    return;
  }

  var photoRemove = e.target.closest('[data-action="photo-remove"]');

    formPhotoData = null;
    var prev = document.getElementById("fotoPreview");
    if(prev){ prev.style.display="none"; prev.removeAttribute("src"); }
    photoRemove.style.display = "none";
    return;
  }

  if(e.target.closest('[data-action="export-trips"]')){
    dbGetAll("trips").then(function(trips){ offerDownload("reizen.csv", tripsToCSVString(trips)); });
    return;
  }
  if(e.target.closest('[data-action="export-trips-excel"]')){
    dbGetAll("trips").then(function(trips){ offerDownload("reizen.html", tripsToExcelHtmlString(trips)); });
    return;
  }
  if(e.target.closest('[data-action="export-ideas"]')){
    dbGetAll("ideas").then(function(ideas){ offerDownload("reis_ideetjes.csv", ideasToCSVString(ideas)); });
    return;
  }
  if(e.target.closest('[data-action="export-ideas-excel"]')){
    dbGetAll("ideas").then(function(ideas){ offerDownload("reis_ideetjes.html", ideasToExcelHtmlString(ideas)); });
    return;
  }
  if(e.target.closest('[data-action="export-keymoments"]')){
    dbGetAll("keymoments").then(function(kms){ offerDownload("key_moments.csv", keyMomentsToCSVString(kms)); });
    return;
  }
  if(e.target.closest('[data-action="export-keymoments-excel"]')){
    dbGetAll("keymoments").then(function(kms){ offerDownload("key_moments.html", keyMomentsToExcelHtmlString(kms)); });
    return;
  }
  if(e.target.closest('[data-action="export-todos"]')){
    dbGetAll("todos").then(function(todos){ offerDownload("bucketlist.csv", todosToCSVString(todos)); });
    return;
  }
  if(e.target.closest('[data-action="export-todos-excel"]')){
    dbGetAll("todos").then(function(todos){ offerDownload("bucketlist.html", todosToExcelHtmlString(todos)); });

  if(e.target.closest('[data-action="export-concerts"]')){
    dbGetAll("concerts").then(function(concerts){ offerDownload("concerts_and_more.csv", concertsToCSVString(concerts)); });

  if(e.target.closest('[data-action="export-concerts-excel"]')){
    dbGetAll("concerts").then(function(concerts){ offerDownload("concerts_and_more.html", concertsToExcelHtmlString(concerts)); });

  var pickContactsBtn = e.target.closest('[data-action="pick-contacts"]');
  if(pickContactsBtn){
    var pickTargetId = pickContactsBtn.getAttribute("data-target");
    var pickInputEl = document.getElementById(pickTargetId);
    if(!pickInputEl) return;
    var currentNames = String(pickInputEl.value||"").split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    dbGetAll("contacts").then(function(contacts){
      contacts.sort(function(a,b){ return String(a.shortName||"").localeCompare(String(b.shortName||"")); });
      var rowsHtml = contacts.map(function(c){
        var checked = currentNames.indexOf(c.shortName)!==-1;
        return '<label style="display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);">'+
          '<input type="checkbox" value="'+esc(c.shortName)+'" data-contact-pick'+(checked?' checked':'')+'> '+esc(c.shortName)+
        '</label>';
      }).join("");
      openModal(
        '<h3>Kies contactpersonen</h3>'+
        (contacts.length ? '<div style="max-height:320px; overflow-y:auto; margin-bottom:14px;">'+rowsHtml+'</div>' : '<p>Nog geen contacten toegevoegd. Voeg eerst contacten toe via "Contacts".</p>')+

          pickInputEl.value = names.join(", ");

      return nextId(aStore, 1).then(function(newId){ return dbAdd(aStore, {id:newId, naam:aVal}); }).then(function(){ toast('"'+aVal+'" toegevoegd.'); render(); });
    });

document.addEventListener("change", function(e){
  if(e.target.matches && e.target.matches('[data-action="photo-input"]')){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    resizeImageFile(file).then(function(dataUrl){
      formPhotoData = dataUrl;
      var prev = document.getElementById("fotoPreview");
      if(prev){ prev.src = dataUrl; prev.style.display = "block"; }
      var rb = document.getElementById("fotoRemoveBtn");
      if(rb) rb.style.display = "inline-flex";
    }).catch(function(){ toast("Kon foto niet laden."); });
    return;
  }
  var importMap = {
    "import-trips": {fn: importTripsCSV, plural:"reis(en)", store:"trips"},
    "import-ideas": {fn: importIdeasCSV, plural:"reis ideetje(s)", store:"ideas"},
    "import-keymoments": {fn: importKeyMomentsCSV, plural:"key moment(s)", store:"keymoments"},
    "import-todos": {fn: importTodosCSV, plural:"bucket-list item(s)", store:"todos"},
    "import-concerts": {fn: importConcertsCSV, plural:"item(s)", store:"concerts"},
    "import-contacts": {fn: importContactsCSV, plural:"contact(en)", store:"contacts"}
  };
  var handled = Object.keys(importMap).some(function(action){
    if(!(e.target.matches && e.target.matches('[data-action="'+action+'"]'))) return false;
    var f = e.target.files && e.target.files[0];
    if(!f) return true;
    var cfg = importMap[action];
    var reader = new FileReader();
    reader.onload = function(){
      cfg.fn(String(reader.result)).then(function(res){
        var msg;
        if(res.noHeaderMatch){ msg = "Kon geen kolommen herkennen in dit bestand — controleer of het een CSV-bestand is met de juiste kolomnamen."; }
        else {
          msg = res.added+" "+cfg.plural+" toegevoegd";
          if(res.updated) msg += ", "+res.updated+" bijgewerkt";
          if(res.skipped) msg += ", "+res.skipped+" overgeslagen ("+describeSkipReasons(res.reasons)+")";
          msg += ".";
        }
        toast(msg);
        render();
      });
    };
    reader.readAsText(f, "UTF-8");
    e.target.value = "";
    return true;
  });
  if(handled) return;
});

    }
  }
  if(e.target.matches && e.target.matches('[data-action="search-list"]')){

    if(!results) return;
    var rows = results.querySelectorAll(".list-row");
    var visibleCount = 0;
    rows.forEach(function(row){
      var match = !q || (row.getAttribute("data-search")||"").indexOf(q) !== -1;
      row.style.display = match ? "" : "none";
      if(match) visibleCount++;
    });
    if(noResults) noResults.style.display = (rows.length>0 && visibleCount===0) ? "block" : "none";
  }
});

document.addEventListener("submit", function(e){
  var form = e.target.closest("form[data-form]");
  if(!form) return;
  e.preventDefault();
  var kind = form.getAttribute("data-form");
  var idAttr = form.getAttribute("data-id");
  var id = idAttr ? Number(idAttr) : null;
  var fd = new FormData(form);

  if(kind==="auth-login" || kind==="auth-signup"){
    var email = String(fd.get("email")||"").trim();
    var wachtwoord = String(fd.get("wachtwoord")||"");
    if(!email || !wachtwoord){ authGateMessage("Vul e-mail en wachtwoord in.", true); return; }
    var btn = form.querySelector("button[type=submit]");
    if(btn) btn.disabled = true;
    var authCall = kind==="auth-signup"
      ? sb.auth.signUp({email:email, password:wachtwoord})
      : sb.auth.signInWithPassword({email:email, password:wachtwoord});
    authCall.then(function(res){
      if(btn) btn.disabled = false;
      if(res.error){ authGateMessage(res.error.message, true); return; }
      if(kind==="auth-signup" && res.data && res.data.user && !res.data.session){
        authGateMessage("Account aangemaakt. Check je e-mail om te bevestigen, log daarna hier in.", false);
        return;
      }
      // Bij succesvolle login start onAuthStateChange automatisch de app.
    }).catch(function(err){
      if(btn) btn.disabled = false;
      authGateMessage((err&&err.message)||"Er ging iets mis. Probeer het opnieuw.", true);
    });
    return;
  }

  if(kind==="trip"){
    var landRaw = String(fd.get("land")||"").trim();
    var jaar = fd.get("jaar"), duur = fd.get("duur"), type = fd.get("type"), validatieTrip = fd.get("validatie");
    if(!landRaw || !jaar || !duur || !type || !validatieTrip){ toast("Vul de verplichte velden in (Land, Jaar, Duur, Type, Validatie)."); return; }
    var c = findCountryByName(landRaw);
    var tripStarsEl = document.getElementById("starsWidget");
    var beoordeling = tripStarsEl ? (Number(tripStarsEl.getAttribute("data-value"))||0) : 0;
    var fields = {
      landCode: c?c.code:null, landNaam: landRaw,
      plaatsen: String(fd.get("plaatsen")||""), groep: String(fd.get("groep")||""),
      jaar: (jaar==="Onbekend" ? "Onbekend" : Number(jaar)),
      maand: String(fd.get("maand")||""),
      vanDatum: String(fd.get("vanDatum")||""), totDatum: String(fd.get("totDatum")||""),
      duur: String(duur), type: String(type),
      beoordeling: beoordeling>0?beoordeling:null,
      metWie: String(fd.get("metWie")||""), organisatie: String(fd.get("organisatie")||""),
      opmerkingen: String(fd.get("opmerkingen")||""), validatie: String(validatieTrip)
    };
    if(id){
      dbGet("trips", id).then(function(existing){
        var obj = Object.assign({}, existing, fields, stampForEdit(existing), {id:id});
        return dbPut("trips", obj);
      }).then(function(){ toast("Reis bijgewerkt."); navigate("#/reizen/"+id); });
    } else {
      addWithId("trips", TRIP_ID_BASE, Object.assign({}, fields, stampForNew())).then(function(newId){
        toast("Reis toegevoegd."); navigate("#/reizen/"+newId);
      });
    }
  } else if(kind==="idea"){
    var landRaw2 = String(fd.get("land")||"").trim();

/* ============================== MIGRATIE: "Concert & film" KEY MOMENTS -> CONCERTS & MORE ============================== */
// Het type "Concert & film" is uit Key Moments gehaald (het zijn leuke herinneringen, geen
// echte key moments) en vervangen door de eigen tabel "Concerts & more". Bestaande key moments van
// dit type worden hier eenmalig automatisch overgezet, met behoud van hun oorspronkelijke
// aanmaak-/wijzigingsgegevens. Dit kijkt alleen naar records met type "Concert & film", dus na de
// eerste keer zijn die er niet meer en is de functie een no-op (veilig om elke start te draaien).
function migrateConcertFilmKeyMoments(){
  return dbGetAll("keymoments").then(function(kms){
    var toMigrate = kms.filter(function(k){ return k.type==="Concert & film"; });
    if(toMigrate.length===0) return;
    var chain = Promise.resolve();
    toMigrate.forEach(function(k){
      chain = chain.then(function(){
        var landLabel = (k.landCode||k.landNaam) ? countryLabel(k.landCode,k.landNaam) : "";
        var locatie = [k.plaats, landLabel].filter(Boolean).join(", ");
        var detailsParts = [];
        if(k.tags) detailsParts.push("Tags: "+k.tags);
        if(k.opmerkingen) detailsParts.push(k.opmerkingen);
        var fieldsMig = {
          jaar: k.jaar, datum: k.datum||"", type: "Overig",
          artiestNaam: k.omschrijving||"", locatie: locatie,
          metWie: k.metWie||"", details: detailsParts.join("\n"),
          beoordeling: null, foto: k.foto||null,
          toegevoegd: k.toegevoegd, toegevoegdDoor: k.toegevoegdDoor,
          gewijzigd: k.gewijzigd, gewijzigdDoor: k.gewijzigdDoor
        };
        return addWithId("concerts", CONCERT_ID_BASE, fieldsMig).then(function(){
          return dbDelete("keymoments", k.id);
        });
      });
    });
    return chain;
  });
}

/* ============================== MIGRATIE: CONTACTS — GSM SAMENVOEGEN, ADRES UITSPLITSEN ============================== */
// Het GSM-veld was eerst 2 losse velden (landcode + nummer) en is nu 1 veld; het adres was eerst
// vrije tekst en is nu uitgesplitst in straat/postcode/plaats/land. Bestaande contacten die nog de
// oude velden hebben, worden hier eenmalig omgezet: het oude GSM-landcode+nummer wordt samengevoegd
// tot het nieuwe "gsm"-veld, en het oude vrije-tekst adres komt (bij gebrek aan beter) in "Straat +
// huisnummer" te staan -- de gebruiker kan dat daarna zelf verder verdelen over de nieuwe velden.
function migrateContactFields(){
  return dbGetAll("contacts").then(function(contacts){
    var needsFix = contacts.filter(function(c){
      return (c.gsmLandcode || c.gsmNummer) || (c.adres && !c.straat);
    });
    if(needsFix.length===0) return;
    var chain = Promise.resolve();
    needsFix.forEach(function(c){
      chain = chain.then(function(){
        var updated = Object.assign({}, c);
        if((c.gsmLandcode || c.gsmNummer) && !c.gsm){
          updated.gsm = [String(c.gsmLandcode||"").trim(), String(c.gsmNummer||"").trim()].filter(Boolean).join(" ");
        }
        delete updated.gsmLandcode;
        delete updated.gsmNummer;
        if(c.adres && !c.straat){ updated.straat = c.adres; }
        delete updated.adres;
        return dbPut("contacts", updated);
      });
    });
    return chain;
  });
}

/* ============================== MIGRATIE: MAAND (NAAM -> NUMMER), VALIDATIE-DEFAULT ============================== */
// Het veld "Maand" bij reizen was een dropdown met maandnamen (bijv. "juli") en is nu een dropdown met
// maandnummers 1-12 (of "Onbekend"). Bestaande reizen met een oude maandnaam worden hier eenmalig
// omgezet naar het bijbehorende nummer. Nieuw: het veld "Validatie" (ok / To check) bij Reizen, Key
// Moments, Concerts & more en Contacts. Bestaande records die dit veld nog niet hebben, krijgen
// eenmalig de standaardwaarde "To check" mee, zodat duidelijk is welke oudere items nog nagekeken
// moeten worden.
function migrateTripMonthToNumeric(){
  return dbGetAll("trips").then(function(trips){
    var toFix = trips.filter(function(t){ return t.maand && MONTHS.indexOf(String(t.maand).toLowerCase())!==-1; });
    if(toFix.length===0) return;
    var chain = Promise.resolve();
    toFix.forEach(function(t){
      chain = chain.then(function(){
        var num = MONTHS.indexOf(String(t.maand).toLowerCase())+1;
        return dbPut("trips", Object.assign({}, t, { maand: String(num) }));
      });
    });
    return chain;
  });
}
function migrateValidatieDefaults(){
  return Promise.all(["trips","keymoments","concerts","contacts"].map(function(store){
    return dbGetAll(store).then(function(rows){
      var toFix = rows.filter(function(r){ return !r.validatie; });
      if(toFix.length===0) return;
      var chain = Promise.resolve();
      toFix.forEach(function(r){
        chain = chain.then(function(){ return dbPut(store, Object.assign({}, r, { validatie: "To check" })); });
      });
      return chain;
    });
  }));
}

/* ============================== AUTH (login/registreren) ==============================
   De pagina staat straks gewoon open op internet (GitHub Pages), dus zonder inloggen is
   er geen enkele bescherming voor de reisgegevens. Dit scherm vervangt de app-inhoud
   zolang er geen geldige Supabase-sessie is; "body.auth-mode" (zie CSS hierboven)
   verbergt de zijbalk/tabbalk zodat er nooit een flits van de (lege) app te zien is
   vóórdat bekend is of iemand is ingelogd. */
function authGateMessage(msg, isError){
  var el = document.getElementById("authGateMsg");
  if(!el) return;
  el.textContent = msg;
  el.className = "subtle" + (isError ? " auth-error" : "");
}
function renderAuthGate(mode){
  mode = mode || "login";
  var isSignup = mode === "signup";
  document.body.classList.add("auth-mode");
  document.getElementById("authGate").innerHTML =
    '<div class="container" style="max-width:380px; padding-top:60px;">' +
      '<div style="text-align:center; margin-bottom:28px;"><h1 style="font-family:var(--font-display);">🧭 My travels and Adventures</h1></div>' +
      '<form data-form="'+(isSignup?'auth-signup':'auth-login')+'">' +
        field("E-mail", "authEmail", '<input type="email" id="authEmail" name="email" required autocomplete="username">', true) +
        field("Wachtwoord", "authPw", '<input type="password" id="authPw" name="wachtwoord" required autocomplete="'+(isSignup?'new-password':'current-password')+'" minlength="6">', true) +
        '<button type="submit" class="btn btn-primary btn-block">'+(isSignup?"Account aanmaken":"Inloggen")+'</button>' +
      '</form>' +
      '<p id="authGateMsg" class="subtle" style="margin-top:14px; text-align:center;"></p>' +
      '<p class="subtle" style="margin-top:22px; text-align:center;">' +
        (isSignup ? "Heb je al een account? " : "Nog geen account? ") +
        '<button type="button" class="btn-link" data-action="auth-toggle" data-mode="'+(isSignup?"login":"signup")+'">'+(isSignup?"Inloggen":"Account aanmaken")+'</button>' +
      '</p>' +
    '</div>';
}

/* ============================== INIT ============================== */
window.addEventListener("hashchange", render);
var appStarted = false;
function startApp(){
  if(appStarted) return;
  appStarted = true;
  document.body.classList.remove("auth-mode");
  if(!location.hash){ location.hash = "#/"; }
  var sidebarEl = document.getElementById("sidebarNav");
  var tabbarEl = document.getElementById("tabbarNav");
  if(sidebarEl) sidebarEl.innerHTML = buildSidebarHtml();
  if(tabbarEl) tabbarEl.innerHTML = buildTabbarHtml();
  Promise.all([migrateConcertFilmKeyMoments(), migrateContactFields(), migrateTripMonthToNumeric()])
    .then(migrateValidatieDefaults).then(render).catch(function(){ render(); });
}
sb.auth.onAuthStateChange(function(event, session){
  if(session){ startApp(); }
  else { appStarted = false; renderAuthGate("login"); }
});

})();
